<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NamiLog</title>
    <style>
      :root {
        --ink: #273044;
        --soft-ink: #5f6f89;
        --muted: #8a94a9;
        --coral: #ff826d;
        --rose: #ee6fa4;
        --lavender: #9aa7ff;
        --peach: #fff0ea;
        --milk: rgba(255, 255, 255, 0.74);
        --glass: rgba(255, 255, 255, 0.64);
        --line: rgba(255, 157, 130, 0.26);
        --shadow: 0 28px 96px rgba(120, 87, 112, 0.16);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at 12% 10%, rgba(255, 130, 109, 0.28), transparent 26%),
          radial-gradient(circle at 82% 8%, rgba(238, 111, 164, 0.24), transparent 26%),
          radial-gradient(circle at 92% 52%, rgba(154, 167, 255, 0.22), transparent 30%),
          linear-gradient(135deg, #fff7f2 0%, #fff9fb 44%, #f8f4ff 100%);
      }

      * { box-sizing: border-box; }
      body { margin: 0; min-width: 320px; min-height: 100vh; }
      button, input, textarea, select { font: inherit; }
      button { cursor: pointer; }

      .app {
        width: min(1320px, calc(100% - 42px));
        margin: 0 auto;
        padding: 28px 0 90px;
      }

      .hero {
        position: relative;
        overflow: hidden;
        min-height: 310px;
        padding: 54px;
        border: 1px solid rgba(255, 255, 255, 0.78);
        border-radius: 42px;
        background: linear-gradient(135deg, rgba(255,255,255,0.84), rgba(255,248,252,0.58));
        box-shadow: var(--shadow);
        backdrop-filter: blur(24px);
      }
      .hero::after {
        content: '';
        position: absolute;
        inset: auto -10% -35% 58%;
        height: 320px;
        border-radius: 999px;
        background: radial-gradient(circle, rgba(238, 111, 164, 0.34), rgba(154, 167, 255, 0.14), transparent 68%);
        filter: blur(4px);
        pointer-events: none;
      }
      .navPills { display: flex; gap: 12px; align-items: center; margin-bottom: 26px; }
      .brandPill, .logoPill {
        display: inline-flex; align-items: center; gap: 10px;
        padding: 10px 18px;
        border-radius: 999px;
        background: rgba(255,255,255,0.74);
        border: 1px solid rgba(255, 158, 135, 0.32);
        color: #e86550;
        font-weight: 900;
        letter-spacing: .14em;
      }
      .logoPill { letter-spacing: .08em; color: #e86550; box-shadow: 0 12px 42px rgba(255, 130, 109, 0.12); }
      .logoDot { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 50%; color: white; background: linear-gradient(135deg, var(--coral), var(--rose), var(--lavender)); }
      .heroContent { position: relative; z-index: 1; display: flex; justify-content: space-between; gap: 36px; align-items: flex-start; }
      .eyebrow { margin: 0 0 12px; color: #e86550; font-size: 13px; font-weight: 900; letter-spacing: .22em; text-transform: uppercase; }
      .hero h1 { margin: 0; font-size: clamp(64px, 10vw, 128px); line-height: .92; letter-spacing: -0.08em; }
      .hero h1 span { color: #a95348; }
      .lead { max-width: 780px; margin: 28px 0 0; color: #65758f; font-size: clamp(17px, 2vw, 23px); line-height: 1.9; }
      .heroActions { display: flex; flex-wrap: wrap; gap: 14px; justify-content: flex-end; min-width: 320px; }

      .primaryButton, .ghostButton, .dangerButton, .softButton, .textButton {
        border: 0;
        border-radius: 22px;
        font-weight: 900;
        transition: transform .18s ease, box-shadow .18s ease, opacity .18s ease;
      }
      .primaryButton {
        padding: 15px 24px;
        color: white;
        background: linear-gradient(135deg, var(--coral), var(--rose) 58%, var(--lavender));
        box-shadow: 0 18px 45px rgba(238, 111, 164, .32);
      }
      .ghostButton, .softButton {
        padding: 15px 22px;
        color: #41506a;
        background: rgba(255,255,255,.75);
        border: 1px solid rgba(255, 158, 135, 0.34);
      }
      .softButton { background: rgba(255, 241, 234, .72); }
      .dangerButton { padding: 13px 18px; color: #c64d58; background: #fff2f2; border: 1px solid rgba(255, 160, 160, .72); }
      .textButton { padding: 8px 2px; color: #4d5870; background: transparent; text-decoration: underline; text-underline-offset: 5px; }
      .primaryButton:hover, .ghostButton:hover, .dangerButton:hover, .softButton:hover, .textButton:hover { transform: translateY(-1px); }
      .small { padding: 10px 13px; border-radius: 15px; font-size: 14px; }

      .noticeBand {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        gap: 20px;
        margin: 26px 0;
        padding: 22px 24px;
        border-radius: 30px;
        background: rgba(255,255,255,.72);
        border: 1px solid rgba(255,255,255,.7);
        box-shadow: var(--shadow);
        backdrop-filter: blur(22px);
      }
      .noticeBand h2 { margin: 0 0 8px; font-size: 22px; letter-spacing: -0.04em; }
      .noticeBand p { margin: 0; color: var(--soft-ink); line-height: 1.8; }
      .noticeActions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: flex-end; }

      .layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(410px, .62fr); gap: 26px; }
      .panel {
        padding: 28px;
        border-radius: 34px;
        background: rgba(255,255,255,.72);
        border: 1px solid rgba(255,255,255,.72);
        box-shadow: var(--shadow);
        backdrop-filter: blur(22px);
      }
      .sectionHeader { display: flex; justify-content: space-between; gap: 16px; align-items: center; margin-bottom: 20px; }
      .sectionHeader h2 { margin: 0; font-size: 32px; letter-spacing: -0.05em; }
      .countBadge { padding: 10px 14px; border-radius: 999px; background: rgba(255, 241, 234, .86); color: #b55b4c; font-weight: 900; }
      .tabRow { display: flex; gap: 9px; flex-wrap: wrap; margin-bottom: 18px; }
      .tabButton { padding: 10px 14px; border: 1px solid rgba(255, 158, 135, .28); border-radius: 999px; color: #65758f; background: rgba(255,255,255,.65); font-weight: 900; }
      .tabButton.active { color: #fff; background: linear-gradient(135deg, var(--coral), var(--rose)); box-shadow: 0 12px 26px rgba(238, 111, 164, .22); }

      .graphCard {
        padding: 20px;
        border-radius: 28px;
        border: 1px solid rgba(255, 158, 135, .24);
        background: linear-gradient(180deg, rgba(255,255,255,.76), rgba(255,247,250,.56));
      }
      .graphTop { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; margin-bottom: 10px; }
      .graphTop h3 { margin: 0; font-size: 24px; letter-spacing: -0.04em; }
      .weatherPill { padding: 10px 14px; border-radius: 999px; background: rgba(255,255,255,.82); border: 1px solid rgba(255, 158, 135, .26); color: #a95348; font-weight: 900; }
      .chartWrap { overflow: hidden; border-radius: 24px; background: rgba(255,255,255,.56); border: 1px solid rgba(255,255,255,.78); }
      svg { display: block; width: 100%; height: auto; }
      .emptyState { display: grid; place-items: center; min-height: 220px; color: var(--muted); text-align: center; border-radius: 24px; border: 1px dashed rgba(255, 158, 135, .34); background: rgba(255,255,255,.38); }
      .emptyState strong { color: var(--ink); font-size: 18px; }

      .insightGrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-top: 16px; }
      .insightCard { padding: 17px; border-radius: 24px; background: rgba(255,255,255,.68); border: 1px solid rgba(255,255,255,.78); }
      .insightCard h3 { margin: 0 0 8px; font-size: 16px; color: #a95348; }
      .insightCard p { margin: 0; color: #52627d; line-height: 1.75; }

      .logList { display: grid; gap: 13px; margin-top: 20px; }
      .logCard { padding: 18px; border: 1px solid rgba(255, 158, 135, .24); border-radius: 26px; background: rgba(255,255,255,.72); }
      .logTop { display: flex; justify-content: space-between; gap: 12px; align-items: center; margin-bottom: 10px; }
      .time { color: #8b7f91; font-weight: 900; }
      .deleteButton { border: 0; color: #c24f5e; background: transparent; font-weight: 900; }
      .logMain { display: flex; gap: 14px; align-items: flex-start; }
      .bigEmoji { display: grid; place-items: center; flex: 0 0 58px; width: 58px; height: 58px; border-radius: 20px; background: linear-gradient(145deg, rgba(255,241,234,.9), rgba(255,255,255,.8)); font-size: 30px; }
      .logMain h3 { margin: 2px 0 8px; font-size: 20px; letter-spacing: -0.03em; }
      .logMain p { margin: 4px 0; color: #5f6f89; line-height: 1.7; }
      .progressText { color: #8a5a72; font-size: 15px; }
      .scoreChip { display: inline-flex; margin-left: 8px; padding: 4px 8px; border-radius: 999px; background: rgba(255,241,234,.78); color: #a95348; font-size: 12px; font-weight: 900; }

      .dailyTextarea { width: 100%; min-height: 330px; resize: vertical; padding: 18px; color: #35425a; border: 1px solid rgba(255, 158, 135, .30); border-radius: 24px; background: rgba(255,255,255,.7); line-height: 1.8; outline: none; }
      .sideActions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
      .settingsBox { margin-top: 18px; padding: 18px; border-radius: 24px; background: linear-gradient(180deg, rgba(255,248,245,.82), rgba(249,244,255,.62)); border: 1px solid rgba(255, 158, 135, .22); }
      .settingsBox h3 { margin: 0 0 8px; }
      .settingRow { display: flex; justify-content: space-between; gap: 16px; align-items: center; margin-top: 12px; color: #4c5b73; font-weight: 800; }
      .settingRow select { padding: 9px 12px; border: 1px solid rgba(255, 158, 135, .34); border-radius: 14px; background: white; }
      .hint { margin: 8px 0 0; color: #7d889c; font-size: 14px; line-height: 1.75; }
      .statusPill { flex: 0 0 auto; padding: 8px 11px; border-radius: 999px; color: #a16d25; background: #fff8e8; border: 1px solid rgba(244,190,88,.55); font-size: 12px; font-weight: 900; }
      .statusPill.granted { color: #2f7a4f; background: #effaf3; border-color: rgba(96,180,123,.45); }
      .statusPill.denied { color: #b04444; background: #fff1f1; border-color: rgba(255,160,160,.7); }
      .statusPill.unsupported { color: #8a6472; background: #fff4f8; border-color: rgba(235,160,190,.55); }
      .notificationHeader { display: flex; justify-content: space-between; gap: 14px; align-items: flex-start; }
      .notificationActions { display: flex; flex-wrap: wrap; gap: 10px; margin: 14px 0 6px; }

      .quickPopup { position: fixed; right: 24px; bottom: 24px; z-index: 50; width: min(540px, calc(100vw - 32px)); max-height: calc(100vh - 48px); overflow: auto; padding: 26px; border-radius: 34px; background: rgba(255,255,255,.88); border: 1px solid rgba(255,255,255,.8); box-shadow: 0 30px 90px rgba(105, 78, 99, .24); backdrop-filter: blur(26px); animation: popupIn .24s ease both; }
      @keyframes popupIn { from { opacity: 0; transform: translateY(18px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
      .popupClose { position: absolute; top: 18px; right: 18px; display: grid; place-items: center; width: 42px; height: 42px; border: 0; border-radius: 999px; color: #7a8598; background: rgba(255,247,250,.9); box-shadow: 0 10px 24px rgba(45,51,88,.08); font-size: 24px; }
      .quickPopup h2 { margin: 0; padding-right: 48px; font-size: 28px; letter-spacing: -0.04em; }
      .popupLead { margin: 8px 0 18px; color: var(--soft-ink); line-height: 1.7; }
      .choiceTitle { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 18px 0 10px; }
      .choiceTitle h3 { margin: 0; font-size: 17px; }
      .choiceTitle span { color: var(--muted); font-weight: 800; font-size: 13px; }
      .choiceGrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 9px; }
      .choiceButton { display: grid; gap: 8px; place-items: center; min-height: 86px; padding: 10px 6px; color: #2f3c53; border: 1px solid rgba(255, 158, 135, .26); border-radius: 20px; background: rgba(255,255,255,.78); box-shadow: 0 12px 28px rgba(45,51,88,.05); }
      .choiceButton span { font-size: 26px; }
      .choiceButton strong { font-size: 12px; }
      .choiceButton.selected { border-color: rgba(255,130,109,.68); background: linear-gradient(180deg, rgba(255,241,234,.96), rgba(255,255,255,.9)); box-shadow: 0 16px 34px rgba(255,130,109,.18); }
      .quickInputs { display: grid; gap: 10px; margin-top: 16px; }
      .quickInputs input, .quickInputs textarea { width: 100%; padding: 13px 15px; border-radius: 18px; border: 1px solid rgba(255, 158, 135, .28); background: rgba(255,255,255,.72); outline: none; color: #273044; }
      .quickInputs textarea { min-height: 72px; resize: vertical; }
      .quickFooter { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center; margin-top: 17px; }
      .quickSaveGroup { display: flex; gap: 10px; flex-wrap: wrap; }

      .toast { position: fixed; left: 50%; bottom: 28px; z-index: 90; padding: 12px 18px; color: white; border-radius: 999px; background: rgba(39,48,68,.93); box-shadow: 0 18px 40px rgba(37,48,68,.25); transform: translateX(-50%); }

      @media (max-width: 980px) {
        .heroContent, .noticeBand, .layout { grid-template-columns: 1fr; display: grid; }
        .heroActions, .noticeActions { justify-content: flex-start; }
        .insightGrid { grid-template-columns: 1fr; }
      }
      @media (max-width: 620px) {
        .app { width: calc(100% - 20px); padding-top: 10px; }
        .hero, .panel { padding: 22px; border-radius: 28px; }
        .hero h1 { font-size: 64px; }
        .choiceGrid { grid-template-columns: repeat(2, 1fr); }
        .quickPopup { right: 10px; bottom: 10px; width: calc(100vw - 20px); }
      }
    </style>
  </head>
  <body>
    <div id="app" class="app"></div>

    <script>
      const STORAGE_KEY = 'namilog.quick-check.logs.v2';
      const OLD_STORAGE_KEYS = ['namilog.quick-check.logs.v1'];
      const SETTINGS_KEY = 'namilog.quick-check.settings.v2';
      const BASE_PATH = '/Namilog/';

      const emotions = [
        { id: 'fun', emoji: '😄', label: '楽しい', score: 2 },
        { id: 'good', emoji: '🙂', label: 'いい感じ', score: 1.5 },
        { id: 'calm', emoji: '😌', label: '穏やか', score: 1 },
        { id: 'tired', emoji: '🥺', label: '少ししんどい', score: -1.4 },
        { id: 'cloudy', emoji: '☁️', label: 'モヤモヤ', score: -1 },
      ];

      const progresses = [
        { id: 'advanced', emoji: '🚀', label: '進んだ', score: 2 },
        { id: 'little', emoji: '🌱', label: '少し進んだ', score: 1 },
        { id: 'stuck', emoji: '🧱', label: '詰まった', score: -1.6 },
        { id: 'scattered', emoji: '🌀', label: '散らかった', score: -1 },
        { id: 'paused', emoji: '⏸️', label: '止まってる', score: -2 },
      ];

      const defaultSettings = {
        intervalMinutes: 120,
        browserNotification: false,
        inAppPopup: true,
      };

      let state = {
        logs: loadLogs(),
        settings: loadSettings(),
        period: 'day',
        quickOpen: false,
        detailOpen: false,
        toast: '',
        swRegistration: null,
        notificationPermission: getNotificationPermission(),
        draft: emptyDraft(),
      };

      let timers = { inApp: null, browser: null, toast: null };

      function emptyDraft() {
        return { emotion: null, progress: null, task: '', memo: '', nextAction: '' };
      }

      function createId() {
        return `${Date.now()}-${Math.random().toString(36).slice(2)}`;
      }

      function normalizeLog(log) {
        const emotion = normalizeEmotion(log.emotion);
        const progress = normalizeProgress(log.progress);
        return {
          id: log.id || createId(),
          createdAt: log.createdAt || new Date().toISOString(),
          emotion,
          emotionScore: typeof log.emotionScore === 'number' ? log.emotionScore : emotion?.score ?? null,
          progress,
          progressScore: typeof log.progressScore === 'number' ? log.progressScore : progress?.score ?? null,
          task: log.task || '',
          taskSource: log.taskSource || 'manual',
          memo: log.memo || '',
          nextAction: log.nextAction || '',
        };
      }

      function normalizeEmotion(value) {
        if (!value) return null;
        const found = emotions.find((item) => item.id === value.id || item.label === value.label);
        return found || value;
      }

      function normalizeProgress(value) {
        if (!value) return null;
        const aliases = { smooth: 'advanced', okay: 'little', busy: 'scattered' };
        const id = aliases[value.id] || value.id;
        const found = progresses.find((item) => item.id === id || item.label === value.label);
        return found || value;
      }

      function loadLogs() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) return JSON.parse(raw).map(normalizeLog);
          for (const key of OLD_STORAGE_KEYS) {
            const oldRaw = localStorage.getItem(key);
            if (oldRaw) {
              const migrated = JSON.parse(oldRaw).map(normalizeLog);
              localStorage.setItem(STORAGE_KEY, JSON.stringify(migrated));
              return migrated;
            }
          }
          return [];
        } catch {
          return [];
        }
      }

      function loadSettings() {
        try {
          const raw = localStorage.getItem(SETTINGS_KEY);
          if (raw) return { ...defaultSettings, ...JSON.parse(raw) };
          return defaultSettings;
        } catch {
          return defaultSettings;
        }
      }

      function saveLogs() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.logs)); }
      function saveSettings() { localStorage.setItem(SETTINGS_KEY, JSON.stringify(state.settings)); }

      function getNotificationPermission() {
        if (!('Notification' in window)) return 'unsupported';
        return Notification.permission;
      }

      function formatTime(dateString) {
        return new Date(dateString).toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });
      }

      function formatDate(dateString) {
        return new Date(dateString).toLocaleDateString('ja-JP', { year: 'numeric', month: '2-digit', day: '2-digit', weekday: 'short' });
      }

      function isSameDay(a, b) {
        return new Date(a).toLocaleDateString('ja-JP') === new Date(b).toLocaleDateString('ja-JP');
      }

      function periodStart(period) {
        const now = new Date();
        const start = new Date(now);
        start.setHours(0, 0, 0, 0);
        if (period === 'week') start.setDate(start.getDate() - 6);
        if (period === 'month') start.setDate(start.getDate() - 29);
        return start;
      }

      function periodLogs(period = state.period) {
        const start = periodStart(period);
        return state.logs
          .filter((log) => new Date(log.createdAt) >= start)
          .sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));
      }

      function motivationScore(log) {
        const emotionScore = typeof log.emotionScore === 'number' ? log.emotionScore : 0;
        const progressScore = typeof log.progressScore === 'number' ? log.progressScore : null;
        if (progressScore === null) return emotionScore;
        return (emotionScore * 0.6) + (progressScore * 0.4);
      }

      function average(numbers) {
        if (!numbers.length) return 0;
        return numbers.reduce((sum, num) => sum + num, 0) / numbers.length;
      }

      function countBy(items, getKey) {
        return items.reduce((acc, item) => {
          const key = getKey(item);
          if (!key) return acc;
          acc[key] = (acc[key] || 0) + 1;
          return acc;
        }, {});
      }

      function topEntry(counts) {
        return Object.entries(counts).sort((a, b) => b[1] - a[1])[0] || null;
      }

      function weatherFromScore(score) {
        if (score >= 1.25) return { emoji: '☀️', label: 'こころ天気は晴れ' };
        if (score >= 0.45) return { emoji: '🌤️', label: '晴れ時々くもり' };
        if (score > -0.35) return { emoji: '☁️', label: 'おだやかなくもり' };
        if (score > -1.1) return { emoji: '🌧️', label: '少し雨模様' };
        return { emoji: '⛈️', label: '荒れ気味の空' };
      }

      function tokenize(text) {
        const stop = new Set(['これ', 'それ', 'ため', 'こと', 'もの', '今日', '明日', 'する', 'した', 'です', 'ます', 'から', 'ので', 'いる', 'ある', 'ない', 'やる', '確認']);
        const normalized = text
          .replace(/[、。！？!?,.()（）「」『』【】\[\]\/\\:：;；\n\r\t]/g, ' ')
          .split(/\s+/)
          .map((word) => word.trim())
          .filter((word) => word.length >= 2 && !stop.has(word));
        return normalized.slice(0, 80);
      }

      function buildInsights(logs) {
        if (!logs.length) {
          return {
            weather: { emoji: '🌱', label: 'まだ波を集め始めたところ' },
            average: 0,
            cards: [
              { title: 'まずは小さく', body: '通知が来たら、感情と進み具合を1回だけ残してみましょう。' },
              { title: '分析のたね', body: 'ログが3件以上たまると、感情・進捗・言葉の傾向が見え始めます。' },
            ],
          };
        }

        const scores = logs.map(motivationScore);
        const avg = average(scores);
        const weather = weatherFromScore(avg);
        const emotionTop = topEntry(countBy(logs, (log) => log.emotion?.label));
        const progressTop = topEntry(countBy(logs, (log) => log.progress?.label));
        const allWords = tokenize(logs.map((log) => `${log.task} ${log.memo} ${log.nextAction}`).join(' '));
        const wordTop = topEntry(countBy(allWords, (word) => word));

        const emotionGroups = {};
        logs.forEach((log) => {
          if (!log.emotion?.label) return;
          emotionGroups[log.emotion.label] ||= [];
          emotionGroups[log.emotion.label].push(log);
        });
        const emotionContext = Object.entries(emotionGroups)
          .map(([label, group]) => {
            const words = tokenize(group.map((log) => `${log.task} ${log.memo}`).join(' '));
            const top = topEntry(countBy(words, (word) => word));
            return top ? { label, word: top[0], count: top[1], size: group.length } : null;
          })
          .filter(Boolean)
          .sort((a, b) => b.count - a.count)[0];

        const taskScores = {};
        allWords.forEach((word) => {
          const related = logs.filter((log) => `${log.task} ${log.memo} ${log.nextAction}`.includes(word));
          if (related.length >= 1) taskScores[word] = average(related.map(motivationScore));
        });
        const lowestTask = Object.entries(taskScores).sort((a, b) => a[1] - b[1])[0];
        const highestTask = Object.entries(taskScores).sort((a, b) => b[1] - a[1])[0];

        const cards = [
          {
            title: '今のこころ天気',
            body: `${weather.emoji} ${weather.label}。平均スコアは ${avg.toFixed(1)} です。`,
          },
          {
            title: '多かった感情と進捗',
            body: `${emotionTop ? `感情は「${emotionTop[0]}」が多め` : '感情はまだ集計中'}。${progressTop ? `進捗は「${progressTop[0]}」が目立ちます。` : '進捗も少しずつ集めましょう。'}`,
          },
          {
            title: 'よく出た言葉',
            body: wordTop ? `この期間は「${wordTop[0]}」という言葉が多く出ています。日報・週報の切り口になりそうです。` : 'タスクやメモが増えると、よく出た言葉を拾えます。',
          },
          {
            title: '感情と話題のつながり',
            body: emotionContext ? `「${emotionContext.label}」の時は「${emotionContext.word}」に触れていることが多そうです。` : 'ログが増えると、感情ごとに気にしていた要素を推定します。',
          },
          {
            title: '上長面談のたね',
            body: lowestTask && highestTask && lowestTask[0] !== highestTask[0]
              ? `「${lowestTask[0]}」は負荷のサイン、「${highestTask[0]}」は前向きなサインかもしれません。`
              : '詰まりやすい仕事・回復しやすい仕事が見えたら、1on1で話す材料にできます。',
          },
        ];

        return { weather, average: avg, cards };
      }

      function buildChart(logs) {
        if (!logs.length) return '<div class="emptyState"><div><strong>まだグラフにする波がありません</strong><br>Quick Checkから1件残すと、ここにモチベーションの線が出ます。</div></div>';
        const width = 820;
        const height = 270;
        const pad = 36;
        const min = -2;
        const max = 2;
        const points = logs.map((log, index) => {
          const x = logs.length === 1 ? width / 2 : pad + (index * (width - pad * 2)) / (logs.length - 1);
          const score = motivationScore(log);
          const y = pad + ((max - score) / (max - min)) * (height - pad * 2);
          return { x, y, log, score };
        });
        const polyline = points.map((p) => `${p.x},${p.y}`).join(' ');
        const area = `${pad},${height - pad} ${polyline} ${width - pad},${height - pad}`;
        const circles = points.map((p) => `<circle cx="${p.x}" cy="${p.y}" r="6" fill="#fff" stroke="#ee6fa4" stroke-width="4"><title>${formatTime(p.log.createdAt)} ${p.log.emotion?.label || ''} ${p.log.progress?.label || ''}</title></circle>`).join('');
        const labels = points.map((p, i) => i % Math.max(1, Math.ceil(points.length / 6)) === 0 ? `<text x="${p.x}" y="${height - 10}" text-anchor="middle" font-size="12" fill="#8a94a9">${formatTime(p.log.createdAt)}</text>` : '').join('');
        return `
          <svg viewBox="0 0 ${width} ${height}" role="img" aria-label="モチベーションの波グラフ">
            <defs>
              <linearGradient id="lineGrad" x1="0" x2="1" y1="0" y2="0">
                <stop offset="0%" stop-color="#ff826d" />
                <stop offset="58%" stop-color="#ee6fa4" />
                <stop offset="100%" stop-color="#9aa7ff" />
              </linearGradient>
              <linearGradient id="areaGrad" x1="0" x2="0" y1="0" y2="1">
                <stop offset="0%" stop-color="#ee6fa4" stop-opacity="0.24" />
                <stop offset="100%" stop-color="#9aa7ff" stop-opacity="0.02" />
              </linearGradient>
            </defs>
            <line x1="${pad}" y1="${pad}" x2="${width - pad}" y2="${pad}" stroke="#ffe0d7" />
            <line x1="${pad}" y1="${height/2}" x2="${width - pad}" y2="${height/2}" stroke="#e8deef" stroke-dasharray="6 8" />
            <line x1="${pad}" y1="${height - pad}" x2="${width - pad}" y2="${height - pad}" stroke="#e1e4f8" />
            <text x="10" y="${pad + 4}" font-size="12" fill="#8a94a9">高</text>
            <text x="10" y="${height/2 + 4}" font-size="12" fill="#8a94a9">中</text>
            <text x="10" y="${height - pad + 4}" font-size="12" fill="#8a94a9">低</text>
            <polygon points="${area}" fill="url(#areaGrad)" />
            <polyline points="${polyline}" fill="none" stroke="url(#lineGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
            ${circles}
            ${labels}
          </svg>`;
      }

      function buildDailyText(logs, insights) {
        const todayLogs = state.logs.filter((log) => isSameDay(log.createdAt, new Date())).sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));
        if (!todayLogs.length) return '今日はまだログがありません。';
        const lines = todayLogs.map((log) => {
          const bits = [`- ${formatTime(log.createdAt)} ${log.emotion?.emoji || ''} ${log.emotion?.label || ''}`];
          if (log.progress) bits.push(`/ ${log.progress.emoji} ${log.progress.label}`);
          if (log.task) bits.push(`\n  - タスク：${log.task}`);
          if (log.memo) bits.push(`\n  - メモ：${log.memo}`);
          if (log.nextAction) bits.push(`\n  - 次：${log.nextAction}`);
          return bits.join(' ');
        });
        return [
          `# NamiLog 日報 ${formatDate(new Date().toISOString())}`,
          '',
          `## 今日のこころ天気`,
          `- ${insights.weather.emoji} ${insights.weather.label}`,
          '',
          '## 今日の波の記録',
          ...lines,
          '',
          '## 日報のたね',
          '- 感情の波：',
          '- 進んだこと：',
          '- 詰まったこと：',
          '- 周囲に相談したいこと：',
          '- 明日の一手：',
        ].join('\n');
      }

      function render() {
        const logs = periodLogs();
        const todayLogs = state.logs.filter((log) => isSameDay(log.createdAt, new Date())).sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
        const insights = buildInsights(logs);
        const dailyText = buildDailyText(logs, insights);
        const permissionLabel = state.notificationPermission === 'granted' ? '許可済み' : state.notificationPermission === 'denied' ? 'ブロック中' : state.notificationPermission === 'unsupported' ? '非対応' : '未許可';

        document.getElementById('app').innerHTML = `
          <header class="hero">
            <div class="navPills">
              <span class="brandPill">NAMILOG</span>
              <span class="logoPill"><span class="logoDot">〜</span><span>NamiLog</span></span>
            </div>
            <div class="heroContent">
              <div>
                <p class="eyebrow">private work journal</p>
                <h1>Nami<span>Log</span></h1>
                <p class="lead">感情の波と仕事の進み方を、やさしく見える化するログアプリです。小さな記録から、日報・週報・1on1のヒントまで自然につなげます。</p>
              </div>
              <div class="heroActions">
                <button class="primaryButton" data-action="openQuick">今の波を残す</button>
                <button class="ghostButton" data-action="copyDaily">日報をコピー</button>
              </div>
            </div>
          </header>

          <section class="noticeBand">
            <div>
              <h2>通知から3秒入力</h2>
              <p>通知をクリックしたら、感情と進み具合をすぐ記録できる小さな入力UIを開きます。</p>
            </div>
            <div class="noticeActions">
              <button class="primaryButton" data-action="requestNotifications">やさしく知らせてもらう</button>
              <button class="ghostButton" data-action="testNotification">今ためす</button>
            </div>
          </section>

          <main class="layout">
            <section class="panel">
              <div class="sectionHeader">
                <div><p class="eyebrow">motivation wave</p><h2>モチベーションの波</h2></div>
                <span class="countBadge">${logs.length}件</span>
              </div>
              <div class="tabRow">
                <button class="tabButton ${state.period === 'day' ? 'active' : ''}" data-period="day">日</button>
                <button class="tabButton ${state.period === 'week' ? 'active' : ''}" data-period="week">週</button>
                <button class="tabButton ${state.period === 'month' ? 'active' : ''}" data-period="month">月</button>
              </div>
              <div class="graphCard">
                <div class="graphTop"><h3>今の波形</h3><span class="weatherPill">${insights.weather.emoji} ${insights.weather.label}</span></div>
                <div class="chartWrap">${buildChart(logs)}</div>
              </div>
              <div class="insightGrid">
                ${insights.cards.map((card) => `<article class="insightCard"><h3>${escapeHtml(card.title)}</h3><p>${escapeHtml(card.body)}</p></article>`).join('')}
              </div>
              <div class="sectionHeader" style="margin-top:28px;"><div><p class="eyebrow">today</p><h2>今日の波</h2></div><span class="countBadge">${todayLogs.length}件</span></div>
              ${todayLogs.length ? `<div class="logList">${todayLogs.map(renderLogCard).join('')}</div>` : `<div class="emptyState"><div><strong>まだ今日の波はありません</strong><br>右下のQuick Checkから、今の状態をひとつ残してみましょう。</div></div>`}
            </section>

            <aside class="panel">
              <div class="sectionHeader"><div><p class="eyebrow">daily reflection</p><h2>日報のたね</h2></div></div>
              <textarea class="dailyTextarea" readonly>${escapeHtml(dailyText)}</textarea>
              <div class="sideActions">
                <button class="primaryButton" data-action="copyDaily">コピー</button>
                <button class="ghostButton" data-action="exportJson">JSON出力</button>
                <button class="dangerButton" data-action="clearAll">全削除</button>
              </div>

              <div class="settingsBox">
                <div class="notificationHeader">
                  <div><h3>リマインド通知</h3><p class="hint">他の作業中でも、Windows右下からNamiLogがそっと声をかけます。</p></div>
                  <span class="statusPill ${state.notificationPermission}">${permissionLabel}</span>
                </div>
                <div class="notificationActions">
                  <button class="primaryButton small" data-action="requestNotifications">通知オン</button>
                  <button class="ghostButton small" data-action="testNotification">テスト通知</button>
                </div>
                <label class="settingRow"><span>定期的に声をかけてもらう</span><input type="checkbox" data-setting="browserNotification" ${state.settings.browserNotification ? 'checked' : ''}></label>
                <label class="settingRow"><span>間隔</span><select data-setting="intervalMinutes"><option value="30" ${state.settings.intervalMinutes === 30 ? 'selected' : ''}>30分</option><option value="60" ${state.settings.intervalMinutes === 60 ? 'selected' : ''}>1時間</option><option value="120" ${state.settings.intervalMinutes === 120 ? 'selected' : ''}>2時間</option><option value="180" ${state.settings.intervalMinutes === 180 ? 'selected' : ''}>3時間</option></select></label>
                <p class="hint">定期通知は、NamiLogを開いている間に動きます。通知をクリックするとQuick Checkが開きます。</p>
              </div>

              <div class="settingsBox">
                <h3>画面内のQuick Check</h3>
                <label class="settingRow"><span>アプリ内でも自動表示する</span><input type="checkbox" data-setting="inAppPopup" ${state.settings.inAppPopup ? 'checked' : ''}></label>
                <p class="hint">これはNamiLog画面の右下に出るポップアップです。</p>
              </div>
            </aside>
          </main>
          ${state.quickOpen ? renderQuickPopup() : ''}
          ${state.toast ? `<div class="toast">${escapeHtml(state.toast)}</div>` : ''}
        `;

        bindEvents();
      }

      function renderLogCard(log) {
        const score = motivationScore(log);
        return `<article class="logCard">
          <div class="logTop"><span class="time">${formatTime(log.createdAt)}</span><button class="deleteButton" data-delete="${log.id}">削除</button></div>
          <div class="logMain">
            <span class="bigEmoji">${log.emotion?.emoji || '🌊'}</span>
            <div>
              <h3>${escapeHtml(log.emotion?.label || '未選択')} ${log.progress ? `<span class="progressText">/ ${log.progress.emoji} ${escapeHtml(log.progress.label)}</span>` : ''}<span class="scoreChip">波 ${score.toFixed(1)}</span></h3>
              ${log.task ? `<p>タスク：${escapeHtml(log.task)}</p>` : ''}
              ${log.memo ? `<p>メモ：${escapeHtml(log.memo)}</p>` : ''}
              ${log.nextAction ? `<p>次：${escapeHtml(log.nextAction)}</p>` : ''}
            </div>
          </div>
        </article>`;
      }

      function renderQuickPopup() {
        return `<div class="quickPopup">
          <button class="popupClose" data-action="closeQuick" aria-label="閉じる">×</button>
          <p class="eyebrow">quick check</p>
          <h2>今のあなたの波を残そう</h2>
          <p class="popupLead">感情と仕事の進み具合を選ぶだけで、日報のたねになります。</p>
          <div class="choiceTitle"><h3>感情</h3><span>1つ選択</span></div>
          <div class="choiceGrid">${emotions.map((item) => renderChoice('emotion', item, state.draft.emotion)).join('')}</div>
          <div class="choiceTitle"><h3>仕事の進み具合</h3><span>できれば選択</span></div>
          <div class="choiceGrid">${progresses.map((item) => renderChoice('progress', item, state.draft.progress)).join('')}</div>
          <div class="quickInputs">
            <input data-draft="task" value="${escapeAttr(state.draft.task)}" placeholder="今やっていたこと（例：提案資料、1on1、レビュー）">
            <textarea data-draft="memo" placeholder="ひとことメモ（任意）">${escapeHtml(state.draft.memo)}</textarea>
            <input data-draft="nextAction" value="${escapeAttr(state.draft.nextAction)}" placeholder="次にやること（任意）">
          </div>
          <div class="quickFooter">
            <button class="textButton" data-action="resetDraft">選択リセット</button>
            <div class="quickSaveGroup">
              <button class="softButton" data-action="saveEmotionOnly">感情だけで残す</button>
              <button class="primaryButton" data-action="saveLog">この波を残す</button>
            </div>
          </div>
        </div>`;
      }

      function renderChoice(type, item, selected) {
        return `<button class="choiceButton ${selected?.id === item.id ? 'selected' : ''}" data-choice-type="${type}" data-choice-id="${item.id}"><span>${item.emoji}</span><strong>${escapeHtml(item.label)}</strong></button>`;
      }

      function bindEvents() {
        document.querySelectorAll('[data-action]').forEach((el) => {
          el.addEventListener('click', () => handleAction(el.dataset.action));
        });
        document.querySelectorAll('[data-period]').forEach((el) => {
          el.addEventListener('click', () => { state.period = el.dataset.period; render(); });
        });
        document.querySelectorAll('[data-delete]').forEach((el) => {
          el.addEventListener('click', () => deleteLog(el.dataset.delete));
        });
        document.querySelectorAll('[data-choice-type]').forEach((el) => {
          el.addEventListener('click', () => selectChoice(el.dataset.choiceType, el.dataset.choiceId));
        });
        document.querySelectorAll('[data-draft]').forEach((el) => {
          el.addEventListener('input', () => { state.draft[el.dataset.draft] = el.value; });
        });
        document.querySelectorAll('[data-setting]').forEach((el) => {
          el.addEventListener('change', () => updateSetting(el));
        });
      }

      function handleAction(action) {
        if (action === 'openQuick') { state.draft = emptyDraft(); state.quickOpen = true; render(); }
        if (action === 'closeQuick') { state.quickOpen = false; state.draft = emptyDraft(); render(); }
        if (action === 'resetDraft') { state.draft = emptyDraft(); render(); }
        if (action === 'saveLog') saveLog(false);
        if (action === 'saveEmotionOnly') saveLog(true);
        if (action === 'copyDaily') copyDailyText();
        if (action === 'exportJson') exportJson();
        if (action === 'clearAll') clearAllLogs();
        if (action === 'requestNotifications') requestBrowserNotifications();
        if (action === 'testNotification') showBrowserNotification('manual');
      }

      function selectChoice(type, id) {
        const list = type === 'emotion' ? emotions : progresses;
        state.draft[type] = list.find((item) => item.id === id);
        render();
      }

      function saveLog(emotionOnly) {
        if (!state.draft.emotion) { showToast('まず感情をひとつ選んでね'); return; }
        const progress = emotionOnly ? null : state.draft.progress;
        const log = normalizeLog({
          id: createId(),
          createdAt: new Date().toISOString(),
          emotion: state.draft.emotion,
          emotionScore: state.draft.emotion.score,
          progress,
          progressScore: progress?.score ?? null,
          task: state.draft.task.trim(),
          taskSource: 'manual',
          memo: state.draft.memo.trim(),
          nextAction: state.draft.nextAction.trim(),
        });
        state.logs = [log, ...state.logs];
        saveLogs();
        state.quickOpen = false;
        state.draft = emptyDraft();
        showToast(progress ? '感情と進み具合を記録しました' : '感情だけ記録しました');
      }

      function deleteLog(id) {
        state.logs = state.logs.filter((log) => log.id !== id);
        saveLogs();
        showToast('ログを削除しました');
      }

      function updateSetting(el) {
        if (el.dataset.setting === 'browserNotification') {
          if (el.checked && Notification.permission !== 'granted') {
            requestBrowserNotifications();
            return;
          }
          state.settings.browserNotification = el.checked;
        }
        if (el.dataset.setting === 'inAppPopup') state.settings.inAppPopup = el.checked;
        if (el.dataset.setting === 'intervalMinutes') state.settings.intervalMinutes = Number(el.value);
        saveSettings();
        setupTimers();
        render();
      }

      function showToast(message) {
        state.toast = message;
        clearTimeout(timers.toast);
        render();
        timers.toast = setTimeout(() => { state.toast = ''; render(); }, 2200);
      }

      async function copyDailyText() {
        const insights = buildInsights(periodLogs('day'));
        const text = buildDailyText(periodLogs('day'), insights);
        try {
          await navigator.clipboard.writeText(text);
          showToast('日報のたねをコピーしました');
        } catch {
          showToast('コピーに失敗しました');
        }
      }

      function exportJson() {
        const blob = new Blob([JSON.stringify(state.logs, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = `namilog-${new Date().toISOString().slice(0, 10)}.json`;
        link.click();
        URL.revokeObjectURL(url);
      }

      function clearAllLogs() {
        if (!window.confirm('すべてのログを削除しますか？')) return;
        state.logs = [];
        saveLogs();
        showToast('すべて削除しました');
      }

      async function registerServiceWorker() {
        if (!('serviceWorker' in navigator)) return null;
        try {
          const registration = await navigator.serviceWorker.register(`${BASE_PATH}namilog-sw.js`);
          state.swRegistration = registration;
          return registration;
        } catch {
          showToast('通知の準備に失敗しました');
          return null;
        }
      }

      async function requestBrowserNotifications() {
        if (!('Notification' in window)) { state.notificationPermission = 'unsupported'; showToast('このブラウザは通知に対応していません'); render(); return; }
        const permission = await Notification.requestPermission();
        state.notificationPermission = permission;
        if (permission === 'granted') {
          state.settings.browserNotification = true;
          saveSettings();
          await showBrowserNotification('manual');
          showToast('リマインド通知をオンにしました');
        } else if (permission === 'denied') {
          showToast('通知がブロックされています。ブラウザ設定から許可してください');
        } else {
          showToast('通知はまだ許可されていません');
        }
        setupTimers();
        render();
      }

      async function showBrowserNotification(reason) {
        if (!('Notification' in window)) { showToast('このブラウザは通知に対応していません'); return; }
        if (Notification.permission !== 'granted') { showToast('先に通知を許可してください'); state.notificationPermission = Notification.permission; render(); return; }
        let registration = state.swRegistration || await registerServiceWorker();
        if (!registration) return;
        const quickCheckUrl = new URL(`${BASE_PATH}?quickCheck=1`, window.location.origin).href;
        await registration.showNotification('NamiLog Quick Check', {
          body: reason === 'scheduled' ? '今の気分と進み具合を、そっと残しておこう。' : 'クリックすると、今の波を3秒で残せます。',
          tag: 'namilog-quick-check',
          renotify: true,
          requireInteraction: false,
          data: { url: quickCheckUrl, reason, createdAt: new Date().toISOString() },
          actions: [
            { action: 'open', title: '今の波を残す' },
            { action: 'later', title: 'あとで' },
          ],
        });
        if (reason === 'manual') showToast('テスト通知を出しました');
      }

      function setupTimers() {
        clearInterval(timers.inApp);
        clearInterval(timers.browser);
        if (state.settings.inAppPopup) {
          timers.inApp = setInterval(() => { state.draft = emptyDraft(); state.quickOpen = true; render(); }, state.settings.intervalMinutes * 60 * 1000);
        }
        if (state.settings.browserNotification && state.notificationPermission === 'granted') {
          timers.browser = setInterval(() => showBrowserNotification('scheduled'), state.settings.intervalMinutes * 60 * 1000);
        }
      }

      function escapeHtml(text) {
        return String(text ?? '').replace(/[&<>"]/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[char]));
      }
      function escapeAttr(text) { return escapeHtml(text).replace(/'/g, '&#39;'); }

      window.addEventListener('load', async () => {
        const params = new URLSearchParams(window.location.search);
        if (params.get('quickCheck') === '1') {
          state.quickOpen = true;
          state.draft = emptyDraft();
          params.delete('quickCheck');
          window.history.replaceState({}, '', `${window.location.pathname}${params.toString() ? `?${params.toString()}` : ''}`);
        }
        await registerServiceWorker();
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.addEventListener('message', (event) => {
            if (event.data?.type === 'OPEN_QUICK_CHECK') {
              state.quickOpen = true;
              state.draft = emptyDraft();
              render();
              window.focus?.();
            }
          });
        }
        setupTimers();
        render();
      });
    </script>
  </body>
</html>
