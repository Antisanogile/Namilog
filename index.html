  <style>
    :root{--bg:#fff7f1;--bg2:#f7edff;--card:#fffdf9;--ink:#403030;--muted:#8a706d;--coral:#ef7b6c;--rose:#ef73a6;--peach:#ffd8c5;--lav:#b9a7ff;--line:#f1d9cf;--shadow:0 22px 70px rgba(125,75,65,.12);font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:radial-gradient(circle at 12% 8%,#ffe2cf 0 21%,transparent 38%),radial-gradient(circle at 88% 12%,#eee6ff 0 24%,transparent 42%),linear-gradient(140deg,var(--bg),var(--bg2))}
    *{box-sizing:border-box}body{margin:0;min-height:100vh}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{width:min(1220px,calc(100% - 28px));margin:0 auto;padding:28px 0 80px}.hero{display:flex;justify-content:space-between;gap:22px;align-items:flex-start;padding:30px;border:1px solid rgba(255,255,255,.75);border-radius:34px;background:rgba(255,253,249,.78);box-shadow:var(--shadow);backdrop-filter:blur(20px)}.badge{display:inline-flex;gap:8px;align-items:center;padding:8px 12px;border-radius:999px;background:#fff1e8;color:#a75d50;font-weight:900;font-size:13px;letter-spacing:.12em}.version{font-size:12px;color:#b0837e;margin-left:8px}.hero h1{margin:16px 0 10px;font-size:clamp(44px,7vw,88px);line-height:.98;letter-spacing:-.07em}.lead{max-width:760px;color:var(--muted);font-size:17px;line-height:1.85;margin:0}.heroActions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}.btn{border:0;border-radius:18px;font-weight:900;padding:13px 17px;transition:.16s;box-shadow:0 12px 30px rgba(125,75,65,.08)}.btn:hover{transform:translateY(-1px)}.primary{color:white;background:linear-gradient(135deg,var(--coral),var(--rose) 58%,var(--lav))}.soft{color:#704c49;background:#fff;border:1px solid var(--line)}.danger{color:#b84f4a;background:#fff0ef;border:1px solid #ffd3cd}.tiny{padding:8px 11px;border-radius:13px;font-size:13px}.grid{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(360px,.88fr);gap:20px;margin-top:20px}.panel{padding:22px;border:1px solid rgba(255,255,255,.78);border-radius:30px;background:rgba(255,253,249,.76);box-shadow:var(--shadow);backdrop-filter:blur(18px);margin-bottom:20px}.sectionHead{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:16px}.eyebrow{margin:0 0 5px;color:#d67666;font-size:12px;font-weight:900;letter-spacing:.16em;text-transform:uppercase}.sectionHead h2,.panel h2{margin:0;font-size:25px;letter-spacing:-.04em}.count{padding:7px 11px;border-radius:999px;background:#ff der:1px dashed #eacfc4;border-radius:24px;color:var(--muted);background:rgba(255,255,255,.42)}.textarea{width:100%;min-height:250px;border:1px solid #efd8cf;border-radius:20px;background:#fffdf9;padding:14px;line-height:1.65;color:var(--ink);resize:vertical}.sideActions{display:flex;gap:9px;flex-wrap:wrap;margin:12px 0 0}.box{margin-top:15px;padding:15px;border-radius:22px;background:rgba(255,244,237,.72);border:1px solid #f1ddd4}.box h3{margin:0 0 9px}.box p{color:var(--muted);line-height:1.7}.setting{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:10px;color:#6e514e;font-weight:800}.setting input[type=text],.setting input[type=email],.setting select{max-width:230px;border:1px solid #ecd4cb;border-radius:13px;background:#fff;padding:8px 10px}.quick{position:fixed;right:22px;bottom:22px;z-index:50;width:min(520px,calc(100vw - 28px));padding:21px;border-radius:30px;background:rgba(255,253,249,.94);box-shadow:0 28px 90px rgba(104,68,72,.22);border:1px solid rgba(255,255,255,.8);backdrop-filter:blur(22px);animation:pop .24s ease both}@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}.close{position:absolute;right:14px;top:14px;width:38px;height:38px;border:0;border-radius:99px;background:#fff4ef;color:#9d706c;font-size:24px}.quick h2{margin:0;font-size:25px;letter-spacing:-.04em}.quick p{color:var(--muted);margin:7px 0 14px}.choiceTitle{display:flex;justify-content:space-between;align-items:center;margin:14px 0 8px;font-weight:900}.choiceTitle span{color:#a98884;font-size:12px}.choices{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.choice{min-height:74px;border:1px solid #f0dcd4;background:#fffdfa;border-radius:19px;display:grid;place-items:center;gap:4px;padding:9px 5px;color:#5d3f3c}.choice .emoji{font-size:24px}.choice b{font-size:11px}.choice.selected{background:linear-gradient(180deg,#fff0e8,#fffdfa);border-color:#ef9a83;box-shadow:0 12px 28px rgba(239,123,108,.16)}.quickFooter{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:15px}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.inputLine{display:grid;gap:8px;margin-top:12px}.inputLine input,.inputLine textarea,.inputLine select{width:100%;border:1px solid #efd8cf;border-radius:16px;background:#fffdf9;padding:12px 13px;color:var(--ink);outline:none}.inputLine textarea{min-height:66px;resize:vertical}.taskChips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.chip{border:1px solid #edd8d1;border-radius:999px;background:#fff;padding:8px 10px;color:#6d4d49}.chip.on{background:#fff0e7;border-color:#ef9a83;color:#a75349;font-weight:900}.status{display:inline-flex;padding:6px 10px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:12px;font-weight:900}.status.ok{background:#effaf3;color:#2f7a4f}.status.warn{background:#fff8e8;color:#9a6a2b}.calendarPaste{min-height:90px}.devDetails summary{cursor:pointer;font-weight:900;color:#73504d}.devGrid{display:grid;gap:12px;margin-top:12px}.toast{position:fixed;left:50%;bottom:28px;z-index:100;transform:translateX(-50%);background:#513837;color:white;padding:12px 18px;border-radius:999px;box-shadow:0 18px 40px rgba(81,56,55,.25);font-weight:800}@media(max-width:920px){.hero,.grid{display:block}.heroActions{justify-content:flex-start;margin-top:14px}.panel{margin-top:18px}.choices{grid-template-columns:repeat(3,1fr)}.kpi,.insights{grid-template-columns:1fr}.quick{right:12px;bottom:12px}.grid{margin-top:0}}
  .reportOff{opacity:.62;background:rgba(255,255,255,.45)}.reportOff .big{filter:grayscale(.35)}
  .onboarding{background:linear-gradient(180deg,rgba(255,246,239,.92),rgba(255,253,249,.82))}.steps{display:grid;gap:9px;margin-top:14px}.step{display:flex;gap:11px;align-items:flex-start;padding:12px;border-radius:18px;background:#fff;border:1px solid #f0ded6}.step>span{width:26px;height:26px;border-radius:999px;display:grid;place-items:center;background:#fff0e7;color:#a75349;font-weight:900;flex:0 0 auto}.step.done>span{background:#effaf3;color:#2f7a4f}.step b{display:block}.step p{margin:3px 0 0;color:var(--muted);font-size:13px;line-height:1.5}
