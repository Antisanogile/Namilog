<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NamiLog</title>
    <style>
      :root {
        --ink: #263145;
        --muted: #78879e;
        --soft: #fff8f5;
        --card: rgba(255, 255, 255, 0.76);
        --line: rgba(244, 121, 105, 0.18);
        --coral: #ff816c;
        --rose: #ef6faf;
        --lavender: #9aa9ff;
        --cream: #fff6ec;
        --good: #ec8b70;
        --bad: #8b7bea;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at 12% 12%, rgba(255, 136, 98, 0.22), transparent 30%),
          radial-gradient(circle at 76% 16%, rgba(239, 111, 175, 0.22), transparent 34%),
          radial-gradient(circle at 91% 72%, rgba(154, 169, 255, 0.24), transparent 32%),
          linear-gradient(135deg, #fff8f4 0%, #fff5f7 45%, #f7f2ff 100%);
      }

      * { box-sizing: border-box; }
      body { margin: 0; min-width: 320px; min-height: 100vh; }
      button, input, textarea, select { font: inherit; }
      button { cursor: pointer; }
      .app { width: min(1240px, calc(100% - 36px)); margin: 0 auto; padding: 24px 0 90px; }
      .topbar { display:flex; align-items:center; justify-content:space-between; gap:16px; margin: 0 0 22px; }
      .brand { display:flex; align-items:center; gap:10px; }
      .brand-chip, .brand-main { border:1px solid rgba(255,129,108,.28); background: rgba(255,255,255,.62); border-radius:999px; padding:10px 16px; font-weight:900; color:#e65f4d; letter-spacing:.16em; }
      .brand-main { display:flex; gap:10px; align-items:center; letter-spacing:.08em; color:#df5f50; padding:9px 20px 9px 10px; }
      .brand-icon { display:grid; place-items:center; width:42px; height:42px; color:white; border-radius:50%; background: linear-gradient(135deg, var(--coral), var(--rose), var(--lavender)); }
      .mini-status { color: var(--muted); font-weight:700; font-size:14px; }
      .hero { position:relative; overflow:hidden; border: 1px solid rgba(255,255,255,.72); border-radius: 36px; padding: 48px; min-height: 310px; background: rgba(255,255,255,.54); box-shadow: 0 26px 90px rgba(90,62,90,.1); backdrop-filter: blur(22px); }
      .hero:before { content:""; position:absolute; inset:auto -8% -35% 42%; height:270px; background: radial-gradient(circle, rgba(255,129,108,.28), transparent 60%); filter: blur(12px); }
      .hero h1 { position:relative; margin:0; font-size: clamp(64px, 10vw, 112px); line-height:.9; letter-spacing:-.08em; background: linear-gradient(105deg, #23304a, #43384e 60%, #c85b4d); -webkit-background-clip:text; color:transparent; }
      .hero p { position:relative; max-width:780px; color:#687891; font-size:18px; line-height:2; margin:26px 0 0; }
      .hero-actions { position:absolute; top:46px; right:48px; display:flex; gap:12px; flex-wrap:wrap; justify-content:flex-end; }
      .primary, .ghost, .danger, .text-btn { border:0; border-radius:22px; font-weight:900; transition:.18s ease; }
      .primary { color:white; padding:16px 24px; background: linear-gradient(135deg, var(--coral), var(--rose) 56%, var(--lavender)); box-shadow: 0 22px 50px rgba(239,111,175,.28); }
      .ghost { color:#34425a; padding:16px 22px; background: rgba(255,255,255,.75); border:1px solid rgba(239,111,175,.18); }
      .danger { color:#c55254; padding:13px 18px; background:#fff4f3; border:1px solid rgba(255,129,108,.28); }
      .text-btn { background:transparent; color:#31415b; text-decoration:underline; text-underline-offset:4px; padding:8px; }
      .primary:hover, .ghost:hover, .danger:hover, .text-btn:hover { transform: translateY(-1px); }
      .small { padding: 10px 14px; border-radius:16px; font-size:14px; }
      .grid { display:grid; grid-template-columns: minmax(0, 1.05fr) minmax(380px, .78fr); gap:22px; margin-top:22px; }
      .panel { border:1px solid rgba(255,255,255,.72); border-radius:32px; padding:28px; background: rgba(255,255,255,.64); box-shadow:0 22px 80px rgba(82,60,92,.08); backdrop-filter: blur(22px); }
      .section-head { display:flex; align-items:flex-start; justify-content:space-between; gap:14px; margin-bottom:20px; }
      .eyebrow { margin:0 0 10px; color:#ef6b55; letter-spacing:.22em; font-size:12px; font-weight:900; text-transform:uppercase; }
      h2 { margin:0; font-size:30px; letter-spacing:-.05em; }
      h3 { margin:0; }
      .badge { display:inline-flex; align-items:center; gap:7px; padding:9px 12px; border-radius:999px; color:#d45b4b; background:#fff3eb; font-weight:900; font-size:13px; border:1px solid rgba(255,129,108,.22); }
      .tabs { display:flex; gap:8px; margin:10px 0 18px; }
      .tab { width:42px; height:42px; border-radius:999px; border:1px solid rgba(255,129,108,.22); background:white; color:#6e7890; font-weight:900; }
      .tab.active { color:white; border:0; background: linear-gradient(135deg, var(--coral), var(--rose)); }
      .chart-card { padding:22px; border:1px solid var(--line); border-radius:26px; background:rgba(255,255,255,.68); }
      .chart-top { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:12px; }
      #waveChart { width:100%; height:260px; display:block; }
      .insight-grid { display:grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap:14px; margin-top:18px; }
      .insight { padding:18px; border-radius:24px; background:rgba(255,255,255,.48); }
      .insight h4 { margin:0 0 8px; color:#bf584f; }
      .insight p { margin:0; color:#67768e; line-height:1.75; }
      .logs { display:grid; gap:12px; margin-top:18px; }
      .log { display:flex; gap:14px; align-items:flex-start; padding:18px; border:1px solid rgba(255,129,108,.16); border-radius:24px; background:rgba(255,255,255,.58); }
      .log-emoji { flex:0 0 58px; display:grid; place-items:center; width:58px; height:58px; border-radius:20px; background:linear-gradient(180deg, #fff, #fff3ef); font-size:28px; }
      .log-body { flex:1; min-width:0; }
      .log-meta { color:#817c8b; font-weight:900; font-size:13px; margin-bottom:7px; display:flex; gap:10px; flex-wrap:wrap; }
      .log-title { font-size:20px; font-weight:900; }
      .log p { margin:7px 0 0; color:#66748b; line-height:1.7; }
      .delete { border:0; background:transparent; color:#c8585f; font-weight:900; }
      .daily { width:100%; min-height:300px; resize:vertical; padding:18px; color:#34445f; background: rgba(255,255,255,.62); border:1px solid rgba(255,129,108,.18); border-radius:22px; line-height:1.8; }
      .side-actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:14px; }
      .settings { margin-top:18px; padding:18px; border-radius:24px; border:1px solid rgba(255,129,108,.16); background:linear-gradient(180deg, rgba(255,248,245,.9), rgba(255,255,255,.45)); }
      .setting-row { display:flex; justify-content:space-between; gap:14px; align-items:center; margin-top:13px; font-weight:800; color:#43536d; }
      .setting-row select, .task-input { border:1px solid rgba(255,129,108,.22); background:white; border-radius:16px; padding:12px 14px; color:#34425a; }
      .status { padding:7px 10px; border-radius:999px; font-weight:900; font-size:12px; background:#fff7de; color:#a36a20; border:1px solid rgba(236,174,64,.4); }
      .status.granted { color:#2d8053; background:#eefaf2; border-color:rgba(63,174,101,.32); }
      .hint { color:#7b879b; line-height:1.8; font-size:14px; margin:12px 0 0; }
      .task-list { display:flex; flex-wrap:wrap; gap:9px; margin-top:12px; }
      .task-pill, .choice { border:1px solid rgba(255,129,108,.2); background:rgba(255,255,255,.68); border-radius:999px; color:#44546f; padding:9px 12px; font-weight:800; }
      .task-pill.active, .choice.active { color:white; border:0; background:linear-gradient(135deg,var(--coral),var(--rose),var(--lavender)); }
      .quick { position:fixed; z-index:60; right:22px; bottom:22px; width:min(520px, calc(100vw - 28px)); max-height:calc(100vh - 44px); overflow:auto; padding:24px; border:1px solid rgba(255,255,255,.78); border-radius:32px; background:rgba(255,255,255,.88); box-shadow:0 34px 110px rgba(75,61,90,.22); backdrop-filter:blur(24px); animation: pop .25s ease both; }
      @keyframes pop { from{opacity:0; transform:translateY(16px) scale(.985)} to{opacity:1; transform:translateY(0) scale(1)} }
      .close { position:absolute; top:16px; right:16px; width:42px; height:42px; border:0; border-radius:50%; color:#708096; background:#fff8f5; font-size:24px; }
      .quick h2 { padding-right:50px; }
      .quick .hint { margin-bottom:18px; }
      .choice-section { margin-top:18px; }
      .choice-title { display:flex; justify-content:space-between; color:#7d8798; font-weight:900; margin-bottom:10px; }
      .choice-grid { display:grid; grid-template-columns:repeat(5,1fr); gap:10px; }
      .choice-card { min-height:96px; display:grid; place-items:center; gap:8px; padding:10px 6px; border:1px solid rgba(255,129,108,.18); border-radius:22px; background:rgba(255,255,255,.7); color:#34425a; font-weight:900; }
      .choice-card span { font-size:29px; }
      .choice-card.active { background:linear-gradient(180deg,#fff4ef,#fff); border-color:rgba(255,129,108,.55); box-shadow:0 15px 36px rgba(255,129,108,.16); }
      .quick-inputs { display:grid; gap:10px; margin-top:18px; }
      .quick-inputs input, .quick-inputs textarea { width:100%; border:1px solid rgba(255,129,108,.22); background:#fff; border-radius:18px; padding:13px 14px; color:#34425a; }
      .quick-inputs textarea { min-height:72px; resize:vertical; }
      .quick-actions { display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-top:18px; align-items:center; }
      .toast { position:fixed; left:50%; bottom:28px; z-index:100; transform:translateX(-50%); padding:12px 18px; border-radius:999px; background:rgba(38,49,69,.94); color:white; font-weight:800; box-shadow:0 18px 42px rgba(38,49,69,.22); }
      .empty { min-height:150px; display:grid; place-items:center; text-align:center; color:#7c879a; border:1px dashed rgba(255,129,108,.22); border-radius:24px; background:rgba(255,255,255,.32); }
      @media (max-width: 980px){ .hero-actions{position:relative; top:auto; right:auto; margin-top:22px; justify-content:flex-start}.grid{grid-template-columns:1fr}.hero{padding:34px}.choice-grid{grid-template-columns:repeat(3,1fr)}.insight-grid{grid-template-columns:1fr} }
      @media (max-width: 560px){ .app{width:calc(100% - 18px); padding-top:12px}.hero,.panel{border-radius:26px;padding:22px}.hero h1{font-size:62px}.choice-grid{grid-template-columns:repeat(2,1fr)}.quick{right:9px; bottom:9px; width:calc(100vw - 18px)} }
    </style>
  </head>
  <body>
    <div id="app" class="app"></div>
    <script>
      const STORAGE_KEY = 'namilog.quick-check.logs.v1';
      const SETTINGS_KEY = 'namilog.quick-check.settings.v1';
      const TASKS_KEY = 'namilog.tasks.v1';
      const BASE_PATH = '/Namilog/';

      const emotions = [
        { id:'fun', emoji:'😄', label:'楽しい', score:2 },
        { id:'good', emoji:'🙂', label:'いい感じ', score:1 },
        { id:'calm', emoji:'😌', label:'穏やか', score:1 },
        { id:'tired', emoji:'🥺', label:'少ししんどい', score:-1 },
        { id:'cloudy', emoji:'☁️', label:'モヤモヤ', score:-1 },
      ];
      const progresses = [
        { id:'moved', emoji:'🚀', label:'進んだ', score:2 },
        { id:'little', emoji:'🌱', label:'少し進んだ', score:1 },
        { id:'scattered', emoji:'🌀', label:'散らかった', score:-1 },
        { id:'stuck', emoji:'🧱', label:'詰まった', score:-2 },
        { id:'paused', emoji:'⏸️', label:'止まってる', score:-1 },
      ];
      const defaultTasks = ['資料作成','会議','顧客対応','研修','1on1','実装','考える時間','日報'];
      let state = {
        logs: load(STORAGE_KEY, []),
        settings: {...{ intervalMinutes:120, browserNotification:false, autoPopup:false }, ...load(SETTINGS_KEY, {})},
        tasks: load(TASKS_KEY, defaultTasks),
        period: 'day',
        quickOpen: new URLSearchParams(location.search).get('quickCheck') === '1' || load(STORAGE_KEY, []).length === 0,
        draft: emptyDraft(),
        toast: '',
        permission: notificationPermission(),
        swRegistration: null,
      };

      if (new URLSearchParams(location.search).get('quickCheck') === '1') history.replaceState({}, '', location.pathname);
      initSW();
      render();
      setupTimers();

      function load(key, fallback){ try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; } catch { return fallback; } }
      function save(key, value){ localStorage.setItem(key, JSON.stringify(value)); }
      function emptyDraft(){ return { emotion:null, progress:null, task:'', memo:'', nextAction:'' }; }
      function normalizeLog(log){
        const emotion = typeof log.emotion === 'string' ? emotions.find(e => e.id === log.emotion || e.label === log.emotion) : log.emotion;
        const progress = typeof log.progress === 'string' ? progresses.find(p => p.id === log.progress || p.label === log.progress) : log.progress;
        return {
          ...log,
          emotion: emotion || log.emotion || null,
          progress: progress || log.progress || null,
          emotionScore: Number.isFinite(log.emotionScore) ? log.emotionScore : (emotion?.score ?? 0),
          progressScore: Number.isFinite(log.progressScore) ? log.progressScore : (progress?.score ?? 0),
          task: log.task || log.taskName || '',
        };
      }
      function logs(){ return state.logs.map(normalizeLog).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)); }
      function nowId(){ return `${Date.now()}-${Math.random().toString(36).slice(2)}`; }
      function fmtTime(s){ return new Date(s).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'}); }
      function fmtDate(s){ return new Date(s).toLocaleDateString('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit',weekday:'short'}); }
      function dayKey(d){ return new Date(d).toLocaleDateString('ja-JP'); }
      function notificationPermission(){ if(!('Notification' in window)) return 'unsupported'; return Notification.permission; }
      function periodLogs(){
        const all = logs(); const now = new Date();
        const days = state.period === 'month' ? 31 : state.period === 'week' ? 7 : 1;
        const min = new Date(now); min.setDate(now.getDate() - (days - 1)); min.setHours(0,0,0,0);
        return all.filter(l => new Date(l.createdAt) >= min).sort((a,b)=>new Date(a.createdAt)-new Date(b.createdAt));
      }
      function todayLogs(){ const today = dayKey(new Date()); return logs().filter(l => dayKey(l.createdAt) === today); }
      function score(log){ return (Number(log.emotionScore)||0) + (Number(log.progressScore)||0); }
      function weather(avg){
        if (avg >= 2.2) return '☀️ 晴れ';
        if (avg >= 0.8) return '🌤 晴れ時々くもり';
        if (avg >= -0.5) return '☁️ くもり';
        if (avg >= -1.8) return '🌧 小雨';
        return '⛈ 荒れ模様';
      }
      function most(arr, get){ const map = {}; arr.forEach(x=>{ const k=get(x); if(k) map[k]=(map[k]||0)+1; }); return Object.entries(map).sort((a,b)=>b[1]-a[1])[0]?.[0] || ''; }
      function wordsIn(text){ return (text || '').replace(/[、。,.!！?？\n]/g,' ').split(/\s+/).filter(w => w.length >= 2 && !['です','ます','こと','ため','今日','明日'].includes(w)); }
      function insights(){
        const ps = periodLogs();
        const avg = ps.length ? ps.reduce((a,l)=>a+score(l),0)/ps.length : 0;
        const topEmotion = most(ps, l => l.emotion?.label);
        const topProgress = most(ps, l => l.progress?.label);
        const words = {}; ps.forEach(l => wordsIn(`${l.task} ${l.memo} ${l.nextAction}`).forEach(w => words[w]=(words[w]||0)+1));
        const topWords = Object.entries(words).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([w])=>w);
        const taskMap = {};
        ps.forEach(l => { const t = l.task || 'タスク未設定'; (taskMap[t] ||= []).push(score(l)); });
        const taskScores = Object.entries(taskMap).map(([task, arr]) => ({ task, avg: arr.reduce((a,b)=>a+b,0)/arr.length, count: arr.length })).sort((a,b)=>a.avg-b.avg);
        const hardTask = taskScores[0]; const brightTask = [...taskScores].reverse()[0];
        return { ps, avg, weather: weather(avg), topEmotion, topProgress, topWords, hardTask, brightTask };
      }
      function dailyText(){
        const ts = todayLogs().slice().reverse();
        if(!ts.length) return '今日はまだ波の記録がありません。';
        const ins = insights();
        const lines = ts.map(l => `- ${fmtTime(l.createdAt)} ${l.emotion?.emoji||''} ${l.emotion?.label||''}${l.progress ? ` / ${l.progress.emoji} ${l.progress.label}` : ''}${l.task ? `｜${l.task}` : ''}${l.memo ? `\n  - メモ：${l.memo}` : ''}${l.nextAction ? `\n  - 次：${l.nextAction}` : ''}`);
        return [
          `# NamiLog 日報 ${fmtDate(new Date())}`,
          '',
          '## 今日のこころ天気',
          `- ${ins.weather}`,
          '',
          '## 今日の波の記録',
          ...lines,
          '',
          '## 今日のまとめのたね',
          `- 感情の波：${ins.topEmotion ? `${ins.topEmotion} が多め` : ''}`,
          `- 進み具合：${ins.topProgress ? `${ins.topProgress} が目立つ` : ''}`,
          `- 進んだこと：`,
          `- 詰まったこと：`,
          `- 明日の一手：`,
          '',
          '## 上長面談のたね',
          `- 話したいタスク：${ins.hardTask?.task || ''}`,
          `- 調子が出やすいタスク：${ins.brightTask?.task || ''}`,
        ].join('\n');
      }

      function render(){
        const app = document.getElementById('app');
        const ins = insights();
        app.innerHTML = `
          <div class="topbar">
            <div class="brand"><span class="brand-chip">NamiLog</span><span class="brand-main"><span class="brand-icon">〜</span>NamiLog</span></div>
            <div class="mini-status">自分だけの波ログ · local</div>
          </div>
          <section class="hero">
            <div class="hero-actions">
              <button class="primary" data-action="openQuick">今の波を残す</button>
              <button class="ghost" data-action="copyDaily">日報をコピー</button>
            </div>
            <p class="eyebrow">Namilog</p>
            <h1>NamiLog</h1>
            <p>感情の波と仕事の進み方を、やさしく見える化するログアプリです。小さな記録から、日報・週報・上長との面談のたねまで自然につなげます。</p>
          </section>
          <main class="grid">
            <section class="panel">
              <div class="section-head"><div><p class="eyebrow">Motivation Wave</p><h2>モチベーションの波</h2></div><span class="badge">${periodLogs().length}件</span></div>
              <div class="tabs">
                <button class="tab ${state.period==='day'?'active':''}" data-period="day">日</button>
                <button class="tab ${state.period==='week'?'active':''}" data-period="week">週</button>
                <button class="tab ${state.period==='month'?'active':''}" data-period="month">月</button>
              </div>
              <div class="chart-card">
                <div class="chart-top"><h3>今の波形</h3><span class="badge">${ins.weather}</span></div>
                ${chartSvg(periodLogs())}
              </div>
              <div class="insight-grid">
                <div class="insight"><h4>今のこころ天気</h4><p>${ins.weather}。平均スコアは ${ins.avg.toFixed(1)} です。</p></div>
                <div class="insight"><h4>多かった感情と進捗</h4><p>感情は「${ins.topEmotion || 'まだ少なめ'}」、進捗は「${ins.topProgress || 'まだ少なめ'}」が目立ちます。</p></div>
                <div class="insight"><h4>よく出た言葉</h4><p>${ins.topWords.length ? ins.topWords.join('・') : 'タスクやメモが増えると、よく出た言葉を拾えます。'}</p></div>
                <div class="insight"><h4>タスクとのつながり</h4><p>${taskInsightText(ins)}</p></div>
              </div>
              <div style="margin-top:28px"><div class="section-head"><div><p class="eyebrow">Today</p><h2>今日の波</h2></div><span class="badge">${todayLogs().length}件</span></div>${logsHtml(todayLogs())}</div>
            </section>
            <aside class="panel">
              <div class="section-head"><div><p class="eyebrow">Daily Reflection</p><h2>日報のたね</h2></div></div>
              <textarea class="daily" readonly>${escapeHtml(dailyText())}</textarea>
              <div class="side-actions"><button class="primary small" data-action="copyDaily">コピー</button><button class="ghost small" data-action="exportJson">JSON出力</button><button class="danger small" data-action="clearAll">全削除</button></div>
              <div class="settings">
                <div class="section-head"><div><h3>リマインド通知</h3><p class="hint">他の作業中でも、Windows右下からNamiLogがそっと声をかけます。</p></div><span class="status ${state.permission}">${permissionLabel()}</span></div>
                <div class="side-actions"><button class="primary small" data-action="requestNotify">通知オン</button><button class="ghost small" data-action="testNotify">テスト通知</button></div>
                <label class="setting-row"><span>定期的に声をかけてもらう</span><input type="checkbox" data-setting="browserNotification" ${state.settings.browserNotification?'checked':''}></label>
                <label class="setting-row"><span>間隔</span><select data-setting="intervalMinutes"><option value="30">30分</option><option value="60">1時間</option><option value="120">2時間</option><option value="180">3時間</option></select></label>
                <p class="hint">通知クリックでQuick Checkが開きます。定期通知はNamiLogを開いている間に動きます。</p>
              </div>
              <div class="settings">
                <h3>今日のタスク候補</h3>
                <p class="hint">Googleカレンダー同期の前段階として、予定候補を手で足せます。Quick Checkで選ぶと分析に使えます。</p>
                <div class="side-actions"><input class="task-input" id="taskInput" placeholder="例：商談準備、1on1、週報" /><button class="ghost small" data-action="addTask">追加</button></div>
                <div class="task-list">${state.tasks.map(t=>`<button class="task-pill" data-task-pick="${escapeAttr(t)}">${escapeHtml(t)}</button>`).join('')}</div>
              </div>
            </aside>
          </main>
          ${state.quickOpen ? quickHtml() : ''}
          ${state.toast ? `<div class="toast">${escapeHtml(state.toast)}</div>` : ''}
        `;
        const intervalSelect = app.querySelector('select[data-setting="intervalMinutes"]'); if(intervalSelect) intervalSelect.value = state.settings.intervalMinutes;
        bind();
      }
      function bind(){
        document.querySelectorAll('[data-action]').forEach(el => el.addEventListener('click', () => actions[el.dataset.action]?.()));
        document.querySelectorAll('[data-period]').forEach(el => el.addEventListener('click',()=>{state.period=el.dataset.period; render();}));
        document.querySelectorAll('[data-emotion]').forEach(el => el.addEventListener('click',()=>{state.draft.emotion = emotions.find(e=>e.id===el.dataset.emotion); render();}));
        document.querySelectorAll('[data-progress]').forEach(el => el.addEventListener('click',()=>{state.draft.progress = progresses.find(p=>p.id===el.dataset.progress); render();}));
        document.querySelectorAll('[data-task]').forEach(el => el.addEventListener('click',()=>{state.draft.task=el.dataset.task; render();}));
        document.querySelectorAll('[data-task-pick]').forEach(el => el.addEventListener('click',()=>{state.draft.task=el.dataset.taskPick; state.quickOpen=true; render();}));
        document.querySelectorAll('[data-setting]').forEach(el => el.addEventListener('change', (e)=>{
          const key = el.dataset.setting;
          if(el.type === 'checkbox') state.settings[key] = e.target.checked; else state.settings[key] = Number(e.target.value);
          save(SETTINGS_KEY, state.settings); setupTimers(); render();
        }));
        const memo = document.getElementById('draftMemo'); if(memo) memo.addEventListener('input', e => state.draft.memo = e.target.value);
        const next = document.getElementById('draftNext'); if(next) next.addEventListener('input', e => state.draft.nextAction = e.target.value);
        const task = document.getElementById('draftTask'); if(task) task.addEventListener('input', e => state.draft.task = e.target.value);
      }
      const actions = {
        openQuick(){ state.draft = emptyDraft(); state.quickOpen = true; render(); },
        closeQuick(){ state.quickOpen = false; render(); },
        saveQuick(){ saveQuick(); },
        copyDaily(){ navigator.clipboard.writeText(dailyText()).then(()=>toast('日報のたねをコピーしました')).catch(()=>toast('コピーに失敗しました')); },
        exportJson(){ const blob = new Blob([JSON.stringify(logs(),null,2)],{type:'application/json'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=`namilog-${new Date().toISOString().slice(0,10)}.json`; a.click(); URL.revokeObjectURL(url); },
        clearAll(){ if(confirm('すべてのログを削除しますか？')){ state.logs=[]; save(STORAGE_KEY,state.logs); toast('すべて削除しました'); render(); } },
        addTask(){ const input=document.getElementById('taskInput'); const value=input?.value.trim(); if(!value) return; if(!state.tasks.includes(value)) state.tasks=[value,...state.tasks]; save(TASKS_KEY,state.tasks); toast('タスク候補を追加しました'); render(); },
        requestNotify(){ requestNotifications(); },
        testNotify(){ showBrowserNotification('manual'); },
      };
      function saveQuick(){
        const d = state.draft;
        if(!d.emotion){ toast('まず感情を選んでね'); return; }
        const log = { id:nowId(), createdAt:new Date().toISOString(), emotion:d.emotion, progress:d.progress, emotionScore:d.emotion.score, progressScore:d.progress?.score ?? 0, task:d.task.trim(), memo:d.memo.trim(), nextAction:d.nextAction.trim(), source:'quick-check-v6' };
        state.logs=[log,...state.logs]; save(STORAGE_KEY,state.logs);
        if(log.task && !state.tasks.includes(log.task)){ state.tasks=[log.task,...state.tasks]; save(TASKS_KEY,state.tasks); }
        state.quickOpen=false; state.draft=emptyDraft(); toast('今の波を残しました'); render();
      }
      function quickHtml(){ return `<div class="quick"><button class="close" data-action="closeQuick">×</button><p class="eyebrow">Quick Check</p><h2>今の波を教えてね</h2><p class="hint">感情と進み具合を残すと、あとから日報・週報のたねになります。</p>
        <div class="choice-section"><div class="choice-title"><span>感情</span><span>1つ選択</span></div><div class="choice-grid">${emotions.map(e=>`<button class="choice-card ${state.draft.emotion?.id===e.id?'active':''}" data-emotion="${e.id}"><span>${e.emoji}</span><strong>${e.label}</strong></button>`).join('')}</div></div>
        <div class="choice-section"><div class="choice-title"><span>仕事の進み具合</span><span>任意だけど推奨</span></div><div class="choice-grid">${progresses.map(p=>`<button class="choice-card ${state.draft.progress?.id===p.id?'active':''}" data-progress="${p.id}"><span>${p.emoji}</span><strong>${p.label}</strong></button>`).join('')}</div></div>
        <div class="choice-section"><div class="choice-title"><span>タスク</span><span>カレンダー同期の前段階</span></div><div class="task-list">${state.tasks.slice(0,8).map(t=>`<button class="choice ${state.draft.task===t?'active':''}" data-task="${escapeAttr(t)}">${escapeHtml(t)}</button>`).join('')}</div></div>
        <div class="quick-inputs"><input id="draftTask" value="${escapeAttr(state.draft.task)}" placeholder="タスクを直接入力" /><textarea id="draftMemo" placeholder="ひとことメモ。空でもOK">${escapeHtml(state.draft.memo)}</textarea><input id="draftNext" value="${escapeAttr(state.draft.nextAction)}" placeholder="次にやること。空でもOK" /></div>
        <div class="quick-actions"><button class="primary" data-action="saveQuick">この波を残す</button><button class="text-btn" data-action="closeQuick">あとで</button></div></div>`; }
      function logsHtml(items){ if(!items.length) return '<div class="empty">まだ記録はありません。今の波をひとつ残してみましょう。</div>'; return `<div class="logs">${items.map(l=>`<article class="log"><div class="log-emoji">${l.emotion?.emoji||'🌊'}</div><div class="log-body"><div class="log-meta"><span>${fmtTime(l.createdAt)}</span>${l.task ? `<span>${escapeHtml(l.task)}</span>`:''}</div><div class="log-title">${escapeHtml(l.emotion?.label||'未選択')}${l.progress ? ` / ${l.progress.emoji} ${escapeHtml(l.progress.label)}`:''}</div>${l.memo?`<p>メモ：${escapeHtml(l.memo)}</p>`:''}${l.nextAction?`<p>次：${escapeHtml(l.nextAction)}</p>`:''}</div><button class="delete" onclick="deleteLog('${l.id}')">削除</button></article>`).join('')}</div>`; }
      window.deleteLog = id => { state.logs=state.logs.filter(l=>l.id!==id); save(STORAGE_KEY,state.logs); toast('削除しました'); render(); };
      function chartSvg(items){
        const width=720, height=260, pad=36; const min=-4,max=4;
        if(!items.length) return `<div class="empty">記録が増えると波形が出ます。</div>`;
        const pts = items.map((l,i)=>{ const x = pad + (items.length===1 ? (width-pad*2)/2 : i*(width-pad*2)/(items.length-1)); const y = pad + (max-score(l))/(max-min)*(height-pad*2); return {x,y,l}; });
        const path = pts.map((p,i)=>`${i?'L':'M'}${p.x},${p.y}`).join(' ');
        return `<svg id="waveChart" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none"><defs><linearGradient id="line" x1="0" x2="1"><stop stop-color="#ff816c"/><stop offset=".55" stop-color="#ef6faf"/><stop offset="1" stop-color="#9aa9ff"/></linearGradient><linearGradient id="fill" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ef6faf" stop-opacity=".26"/><stop offset="1" stop-color="#9aa9ff" stop-opacity=".02"/></linearGradient></defs><line x1="${pad}" x2="${width-pad}" y1="${pad}" y2="${pad}" stroke="#ffe2dc"/><line x1="${pad}" x2="${width-pad}" y1="${height/2}" y2="${height/2}" stroke="#e7ddf1" stroke-dasharray="6 8"/><line x1="${pad}" x2="${width-pad}" y1="${height-pad}" y2="${height-pad}" stroke="#e7eaf5"/><text x="8" y="${pad+5}" fill="#9aa0ad" font-size="12">高</text><text x="8" y="${height/2+5}" fill="#9aa0ad" font-size="12">中</text><text x="8" y="${height-pad+5}" fill="#9aa0ad" font-size="12">低</text><path d="${path} L${pts[pts.length-1].x},${height-pad} L${pts[0].x},${height-pad} Z" fill="url(#fill)"/><path d="${path}" fill="none" stroke="url(#line)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>${pts.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="6" fill="#fff" stroke="#ef6faf" stroke-width="4"/>`).join('')}${pts.map((p,i)=> i%Math.ceil(pts.length/5||1)===0 ? `<text x="${p.x-16}" y="${height-8}" fill="#9aa0ad" font-size="10">${fmtTime(p.l.createdAt)}</text>` : '').join('')}</svg>`;
      }
      function taskInsightText(ins){ if(!ins.ps.length) return 'ログが増えると、感情とタスクのつながりを推定します。'; if(ins.hardTask && ins.hardTask.avg < 0) return `「${ins.hardTask.task}」のときに波が下がりやすそうです。上長面談で扱う候補です。`; if(ins.brightTask) return `「${ins.brightTask.task}」のときに波が上がりやすそうです。再現条件を探せます。`; return 'タスクを紐づけると、波の傾向が見えやすくなります。'; }
      function permissionLabel(){ return state.permission==='granted'?'許可済み':state.permission==='denied'?'ブロック中':state.permission==='unsupported'?'非対応':'未許可'; }
      function escapeHtml(s){ return String(s ?? '').replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }
      function escapeAttr(s){ return escapeHtml(s).replace(/'/g,'&#39;'); }
      function toast(msg){ state.toast=msg; render(); setTimeout(()=>{state.toast=''; render();},2100); }
      async function initSW(){ if(!('serviceWorker' in navigator)) return; try { state.swRegistration = await navigator.serviceWorker.register(`${BASE_PATH}namilog-sw.js`); navigator.serviceWorker.addEventListener('message', e=>{ if(e.data?.type==='OPEN_QUICK_CHECK'){ state.draft=emptyDraft(); state.quickOpen=true; render(); }}); } catch(e){} }
      async function requestNotifications(){ if(!('Notification' in window)){ state.permission='unsupported'; render(); return; } const p = await Notification.requestPermission(); state.permission = p; if(p==='granted'){ state.settings.browserNotification = true; save(SETTINGS_KEY,state.settings); toast('リマインド通知を許可しました'); showBrowserNotification('manual'); } else toast('通知はまだ許可されていません'); render(); }
      async function showBrowserNotification(reason='manual'){
        if(!('Notification' in window) || Notification.permission !== 'granted'){ toast('先に通知オンを押してね'); return; }
        let reg = state.swRegistration || await navigator.serviceWorker.register(`${BASE_PATH}namilog-sw.js`);
        await reg.showNotification('NamiLog Quick Check', { body: reason==='scheduled'?'今の気分と進み具合を、そっと残しておこう。':'クリックするとQuick Checkを開きます。', tag:'namilog-quick-check', renotify:true, data:{ url: new URL(`${BASE_PATH}?quickCheck=1`, location.origin).href }, actions:[{action:'open',title:'記録する'},{action:'later',title:'あとで'}] });
        if(reason==='manual') toast('テスト通知を出しました');
      }
      let intervalId = null;
      function setupTimers(){ if(intervalId) clearInterval(intervalId); if(state.settings.browserNotification){ intervalId = setInterval(()=>showBrowserNotification('scheduled'), state.settings.intervalMinutes*60*1000); } }
    </script>
  </body>
</html>
