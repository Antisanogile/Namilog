<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NamiLog</title>
  <style>
    :root{
      --ink:#243047; --muted:#74829a; --soft:#fff7f3; --card:rgba(255,255,255,.76);
      --line:rgba(255,137,112,.25); --coral:#ff7d69; --pink:#ed67a8; --lav:#9ca4ff; --cream:#fffaf5;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color:var(--ink); background:#fff8f4;
    }
    *{box-sizing:border-box} body{margin:0; min-width:320px; min-height:100vh; background:
      radial-gradient(circle at 15% 6%, rgba(255,126,94,.25), transparent 26%),
      radial-gradient(circle at 76% 3%, rgba(238,103,168,.20), transparent 28%),
      radial-gradient(circle at 96% 46%, rgba(151,163,255,.22), transparent 25%),
      linear-gradient(135deg,#fffaf6 0%,#fff1ef 42%,#f7f1ff 100%);}
    button,input,textarea,select{font:inherit} button{cursor:pointer}
    .app{width:min(1180px,calc(100% - 32px)); margin:0 auto; padding:24px 0 80px}
    .hero{position:relative; overflow:hidden; min-height:270px; padding:44px; border:1px solid rgba(255,255,255,.78); border-radius:34px; background:rgba(255,255,255,.58); box-shadow:0 26px 100px rgba(149,92,110,.12); backdrop-filter:blur(22px)}
    .hero:after{content:""; position:absolute; inset:auto -8% -55% 55%; height:260px; background:radial-gradient(circle,rgba(237,103,168,.24),transparent 64%); pointer-events:none}
    .eyebrow{margin:0 0 10px; color:#e66553; font-size:13px; font-weight:900; letter-spacing:.28em; text-transform:uppercase}
    h1{margin:0; font-size:clamp(58px,9vw,104px); line-height:.9; letter-spacing:-.075em; color:#263149}
    .lead{max-width:760px; margin:22px 0 0; color:#62718b; font-size:18px; line-height:1.9}
    .heroActions{position:absolute; top:40px; right:40px; display:flex; flex-wrap:wrap; gap:12px; justify-content:flex-end}
    .pill{display:inline-flex; align-items:center; gap:8px; padding:9px 16px; border-radius:999px; background:rgba(255,255,255,.72); border:1px solid rgba(255,139,112,.25); box-shadow:0 12px 30px rgba(149,92,110,.08); color:#df604f; font-weight:900; letter-spacing:.14em}
    .primary,.ghost,.danger,.textBtn{border:0; border-radius:20px; font-weight:900; transition:transform .16s ease, box-shadow .16s ease, opacity .16s ease}
    .primary{padding:15px 22px; color:white; background:linear-gradient(135deg,var(--coral),var(--pink) 58%,var(--lav)); box-shadow:0 18px 40px rgba(237,103,168,.30)}
    .ghost{padding:15px 20px; color:#40506b; background:rgba(255,255,255,.76); border:1px solid rgba(255,139,112,.25)}
    .danger{padding:12px 16px; color:#c54f58; background:#fff2f0; border:1px solid rgba(255,139,112,.35)}
    .textBtn{padding:8px 4px; color:#c35364; background:transparent; text-decoration:underline; text-underline-offset:4px}
    .small{padding:10px 13px; border-radius:14px; font-size:13px}.primary:hover,.ghost:hover,.danger:hover,.textBtn:hover{transform:translateY(-1px)}
    .layout{display:grid; grid-template-columns:minmax(0,1.1fr) minmax(360px,.85fr); gap:22px; margin-top:22px}.span{grid-column:1/-1}
    .panel{padding:26px; border:1px solid rgba(255,255,255,.75); border-radius:30px; background:var(--card); box-shadow:0 24px 90px rgba(149,92,110,.09); backdrop-filter:blur(20px)}
    .sectionHead{display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:18px}.sectionHead h2{margin:0; font-size:28px; letter-spacing:-.05em}.badge{padding:8px 12px; border-radius:999px; color:#c75d50; background:#fff0e9; border:1px solid rgba(255,139,112,.24); font-weight:900}
    .tabs{display:flex; gap:9px; margin:8px 0 18px}.tab{width:42px; height:42px; border-radius:999px; border:1px solid rgba(255,139,112,.25); color:#6e7890; background:#fff; font-weight:900}.tab.active{color:white; background:linear-gradient(135deg,#ff7d69,#ed67a8); border-color:transparent}
    .waveCard{padding:20px; border:1px solid var(--line); border-radius:24px; background:linear-gradient(180deg,rgba(255,255,255,.84),rgba(255,250,249,.72))}.waveTop{display:flex; align-items:center; justify-content:space-between; gap:12px}.weather{padding:8px 12px; border-radius:999px; color:#bf6755; background:#fff8f2; border:1px solid rgba(255,139,112,.24); font-weight:900}
    svg{display:block; width:100%; height:210px; margin-top:12px}.axis{font-size:11px; fill:#9ca7b8}.grid{stroke:#f4d9d1; stroke-width:1}.mid{stroke:#e9ddea; stroke-dasharray:5 7}.area{fill:url(#warmArea)}.line{fill:none; stroke:url(#warmLine); stroke-width:5; stroke-linecap:round; stroke-linejoin:round}.dot{fill:#fff; stroke:#ed67a8; stroke-width:4}
    .insightGrid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; margin-top:18px}.insight{min-height:120px; padding:18px; border-radius:22px; background:rgba(255,255,255,.52)}.insight h3{margin:0 0 10px; color:#c8524b; font-size:15px}.insight p{margin:0; color:#61708a; line-height:1.75}
    .logList{display:grid; gap:12px}.logCard{display:grid; grid-template-columns:auto 1fr auto; gap:14px; align-items:center; padding:16px; border:1px solid var(--line); border-radius:22px; background:rgba(255,255,255,.72)}.emojiBox{width:58px; height:58px; display:grid; place-items:center; border-radius:18px; background:linear-gradient(135deg,#fff2ed,#fff)}.emojiBox span{font-size:30px}.logCard h3{margin:0 0 5px; font-size:18px}.logCard p{margin:3px 0; color:#65738a; line-height:1.6}.time{color:#90869a; font-weight:900; font-size:13px}.empty{display:grid; place-items:center; min-height:240px; text-align:center; color:#74829a; border:1px dashed rgba(255,139,112,.35); border-radius:24px}
    .dailyTextarea{width:100%; min-height:320px; resize:vertical; padding:17px; border:1px solid var(--line); border-radius:20px; background:rgba(255,255,255,.70); color:#39465f; line-height:1.75}.sideActions{display:flex; flex-wrap:wrap; gap:10px; margin-top:14px}
    .settingsBox{margin-top:18px; padding:18px; border:1px solid var(--line); border-radius:22px; background:linear-gradient(180deg,rgba(255,250,247,.85),rgba(255,255,255,.56))}.settingsBox h3{margin:0 0 8px}.hint{margin:8px 0 0; color:#7c899e; font-size:13px; line-height:1.65}.settingRow{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:13px; color:#46556d; font-weight:800}.settingRow select,.settingsBox input{padding:10px 12px; border:1px solid rgba(255,139,112,.35); border-radius:14px; background:#fff}.taskInput{display:flex; gap:8px; margin-top:12px}.taskInput input{min-width:0; flex:1}.chipRow{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px}.chip{border:1px solid rgba(255,139,112,.3); border-radius:999px; padding:8px 12px; background:#fffaf8; color:#536278; font-weight:800}.statusPill{flex:0 0 auto; padding:7px 10px; border-radius:999px; color:#9a6a2b; background:#fff8e8; border:1px solid rgba(244,190,88,.55); font-size:12px; font-weight:900}.statusPill.granted{color:#2f7a4f;background:#effaf3;border-color:rgba(96,180,123,.45)}.statusPill.denied{color:#b04444;background:#fff1f1;border-color:rgba(255,160,160,.7)}
    .modalBackdrop{position:fixed; inset:0; z-index:70; display:grid; place-items:center; padding:24px; background:rgba(255,245,244,.68); backdrop-filter:blur(12px)}.quick{position:relative; width:min(760px,100%); max-height:92vh; overflow:auto; padding:32px; border:1px solid rgba(255,255,255,.82); border-radius:36px; background:rgba(255,255,255,.92); box-shadow:0 34px 120px rgba(147,82,105,.22)}.close{position:absolute; top:20px; right:20px; width:44px; height:44px; display:grid; place-items:center; border:0; border-radius:999px; background:#fff8f7; color:#7d879a; font-size:24px; box-shadow:0 10px 24px rgba(149,92,110,.08)}.quick h2{margin:0; padding-right:54px; font-size:clamp(30px,5vw,48px); letter-spacing:-.06em}.quickLead{margin:10px 0 22px; color:#74829a; font-size:17px}.choiceTitle{display:flex; justify-content:space-between; align-items:center; margin:20px 0 12px}.choiceTitle h3{margin:0}.choiceGrid{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:12px}.choice{display:grid; place-items:center; gap:10px; min-height:118px; padding:14px 8px; border:1px solid rgba(236,205,199,.75); border-radius:24px; background:#fff; color:#29354b; box-shadow:0 18px 44px rgba(149,92,110,.06)}.choice span{font-size:34px}.choice strong{font-size:14px}.choice.selected{border-color:rgba(255,125,105,.65); background:linear-gradient(180deg,#fff6f2,#fff); box-shadow:0 18px 44px rgba(237,103,168,.14)}.quickFields{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:20px}.quickFields label{display:grid; gap:8px; color:#46556d; font-weight:900}.quickFields input,.quickFields textarea,.quickFields select{width:100%; padding:13px 15px; border:1px solid rgba(255,139,112,.35); border-radius:17px; background:#fff; color:#263149}.quickFields .wide{grid-column:1/-1}.modalActions{display:flex; flex-wrap:wrap; gap:12px; margin-top:22px}
    .toast{position:fixed; z-index:99; left:50%; bottom:26px; transform:translateX(-50%); padding:12px 18px; border-radius:999px; color:#fff; background:rgba(36,48,71,.92); box-shadow:0 18px 44px rgba(36,48,71,.25); font-weight:800}.version{position:fixed; right:12px; bottom:8px; color:#b98a96; font-size:11px; font-weight:800}
    .profilePill{margin-left:8px; color:#7f5d70; background:rgba(255,255,255,.62)}
    .profileBox{border-color:rgba(156,164,255,.28); background:linear-gradient(180deg,rgba(255,250,253,.88),rgba(255,255,255,.58))}


    .dbBox{border-color:rgba(156,164,255,.34); background:linear-gradient(180deg,rgba(248,246,255,.88),rgba(255,255,255,.60))}
    .checkGrid{display:grid; gap:8px; margin-top:12px}
    .checkItem{display:flex; align-items:flex-start; gap:10px; padding:10px 12px; border:1px solid rgba(156,164,255,.22); border-radius:16px; background:rgba(255,255,255,.58); color:#4f5f78; line-height:1.55}
    .checkItem b{color:#263149}
    .privacyNote{margin-top:12px; padding:12px 14px; border-radius:18px; background:rgba(255,246,240,.80); color:#7b6670; line-height:1.65; border:1px solid rgba(255,139,112,.22)}
    .schemaPreview{width:100%; min-height:88px; margin-top:10px; padding:12px; border:1px solid rgba(156,164,255,.22); border-radius:16px; background:rgba(255,255,255,.68); color:#536278; font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:12px; line-height:1.55}

    .calendarPaste{width:100%; min-height:96px; resize:vertical; margin-top:12px; padding:12px 14px; border:1px solid rgba(255,139,112,.35); border-radius:18px; background:rgba(255,255,255,.78); color:#39465f; line-height:1.65}
    .miniList{display:grid; gap:8px; margin-top:12px}.miniItem{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 12px; border:1px solid rgba(255,139,112,.22); border-radius:16px; background:rgba(255,255,255,.6); color:#536278; font-weight:800}.miniItem small{color:#c75d50; font-weight:900}.softNote{margin-top:10px; padding:11px 13px; border-radius:16px; background:rgba(255,242,237,.72); color:#7c6670; font-size:13px; line-height:1.65}

    .aiBox{border-color:rgba(237,103,168,.28); background:linear-gradient(180deg,rgba(255,246,250,.9),rgba(255,255,255,.62))}
    .aiActionGrid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin-top:12px}
    .aiPromptPreview{width:100%; min-height:112px; margin-top:12px; resize:vertical; padding:12px 14px; border:1px solid rgba(237,103,168,.24); border-radius:18px; background:rgba(255,255,255,.72); color:#4b5870; line-height:1.65; font-size:13px}
    .signalList{display:grid; gap:8px; margin-top:12px}.signalItem{padding:10px 12px; border-radius:16px; background:rgba(255,255,255,.62); border:1px solid rgba(237,103,168,.18); color:#56647b; line-height:1.55}.signalItem b{color:#c8524b}

    @media(max-width:920px){.heroActions{position:static; margin-top:22px; justify-content:flex-start}.layout{grid-template-columns:1fr}.insightGrid{grid-template-columns:1fr}.choiceGrid{grid-template-columns:repeat(2,1fr)}.quickFields{grid-template-columns:1fr}}
    @media(max-width:560px){.app{width:calc(100% - 20px); padding-top:10px}.hero,.panel,.quick{padding:20px; border-radius:26px}h1{font-size:58px}.choice{min-height:104px}}
  </style>
</head>
<body>
  <div id="app" class="app"></div>
  <script>
    const STORAGE_KEY='namilog.quick-check.logs.v1';
    const SETTINGS_KEY='namilog.quick-check.settings.v1';
    const TASKS_KEY='namilog.taskCandidates.v1';
    const CALENDAR_KEY='namilog.calendarItems.v1';
    const PROFILE_KEY='namilog.profile.v1';
    const GOOGLE_KEY='namilog.googleCalendar.v1';
    const BASE_PATH='/Namilog/';
    const VERSION='v12 ai-insight-pack';
    const emotions=[
      {id:'fun',emoji:'😄',label:'楽しい',score:2},{id:'good',emoji:'🙂',label:'いい感じ',score:2},{id:'calm',emoji:'😌',label:'穏やか',score:1},{id:'tired',emoji:'🥺',label:'少ししんどい',score:-2},{id:'cloudy',emoji:'☁️',label:'モヤモヤ',score:-1}
    ];
    const progresses=[
      {id:'smooth',emoji:'🚀',label:'順調',score:2},{id:'okay',emoji:'👌',label:'まあまあ',score:1},{id:'little',emoji:'🌱',label:'少し進んだ',score:1},{id:'scattered',emoji:'🌀',label:'散らかった',score:-1},{id:'stuck',emoji:'🧱',label:'詰まった',score:-2}
    ];
    const defaultTasks=['資料作成','会議','顧客対応','研修','1on1','実装','考える時間','日報'];
    const defaultSettings={intervalMinutes:120, browserNotification:false};
    const defaultProfile={name:'',email:'',team:'',privateMode:true};
    let state={logs:loadLogs(),settings:loadSettings(),profile:loadProfile(),google:loadGoogleSettings(),tasks:loadTasks(),calendarItems:loadCalendarItems(),calendarText:'',range:'day',quickOpen:false,draft:blankDraft(),toast:'',permission:getPermission(),registration:null,filterTask:'',newTask:''};

    function blankDraft(){return{emotion:null,progress:null,task:'',memo:'',nextAction:''}}
    function safeParse(raw,fallback){try{return raw?JSON.parse(raw):fallback}catch{return fallback}}
    function loadLogs(){return safeParse(localStorage.getItem(STORAGE_KEY),[]).map(normalizeLog).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt))}
    function loadSettings(){return {...defaultSettings,...safeParse(localStorage.getItem(SETTINGS_KEY),{})}}
    function loadProfile(){return {...defaultProfile,...safeParse(localStorage.getItem(PROFILE_KEY),{})}}
    function saveProfile(){localStorage.setItem(PROFILE_KEY,JSON.stringify(state.profile))}
    function loadGoogleSettings(){return {clientId:'',connected:false,lastSyncAt:'',lastError:'',...safeParse(localStorage.getItem(GOOGLE_KEY),{})}}
    function saveGoogleSettings(){localStorage.setItem(GOOGLE_KEY,JSON.stringify(state.google))}
    function profileLabel(){return state.profile.name||state.profile.email||'自分だけのログ'}
    function profileHint(){return state.profile.email?`このブラウザ内では ${state.profile.email} の個人ログとして扱います。`: '今はこのブラウザ内だけの個人ログです。メールを入れると、後で個別アカウント化しやすくなります。'}
    function loadTasks(){const raw=safeParse(localStorage.getItem(TASKS_KEY),null); return Array.isArray(raw)&&raw.length?raw:defaultTasks}
    function loadCalendarItems(){const raw=safeParse(localStorage.getItem(CALENDAR_KEY),[]); return Array.isArray(raw)?raw:[]}
    function saveLogs(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state.logs))}
    function saveSettings(){localStorage.setItem(SETTINGS_KEY,JSON.stringify(state.settings))}
    function saveTasks(){localStorage.setItem(TASKS_KEY,JSON.stringify(state.tasks))}
    function saveCalendarItems(){localStorage.setItem(CALENDAR_KEY,JSON.stringify(state.calendarItems))}
    
    function calendarTaskLabel(item){return `${item.time||''}${item.time?' ':''}${item.title}`.trim()}
    function allTaskOptions(){return Array.from(new Set([...state.calendarItems.map(calendarTaskLabel),...state.tasks])).filter(Boolean)}
    function draftWithSuggestedTask(){const d=blankDraft(); const suggested=currentCalendarTask(); if(suggested)d.task=suggested; return d}
    function minutesOf(t){const m=String(t||'').match(/(\d{1,2}):(\d{2})/); return m?Number(m[1])*60+Number(m[2]):null}
    function currentCalendarTask(){if(!state.calendarItems.length)return ''; const now=new Date(); const n=now.getHours()*60+now.getMinutes(); let best=null; for(const item of state.calendarItems){const start=minutesOf(item.time); const end=minutesOf(item.end); if(start==null)continue; if(end!=null&&n>=start&&n<=end){best=item; break} if(start<=n)best=item;} return best?calendarTaskLabel(best):calendarTaskLabel(state.calendarItems[0])}
    function parseCalendarText(text){
      return text.split(/\n+/).map(line=>line.trim()).filter(Boolean).map((line,i)=>{
        let m=line.match(/^(\d{1,2}:\d{2})\s*(?:[-〜~]\s*(\d{1,2}:\d{2}))?\s*(.+)$/);
        if(m)return{id:`cal-${Date.now()}-${i}`,time:m[1],end:m[2]||'',title:m[3].replace(/^[-–—\s]+/,'').trim()};
        m=line.match(/^(.+?)\s+(\d{1,2}:\d{2})(?:\s*[-〜~]\s*(\d{1,2}:\d{2}))?$/);
        if(m)return{id:`cal-${Date.now()}-${i}`,time:m[2],end:m[3]||'',title:m[1].trim()};
        return{id:`cal-${Date.now()}-${i}`,time:'',end:'',title:line};
      }).filter(x=>x.title)
    }
    function getPermission(){if(!('Notification' in window)) return 'unsupported'; return Notification.permission}
    function findEmotion(x){if(!x)return null; return emotions.find(e=>e.id===x.id||e.label===x.label||e.emoji===x.emoji)||x}
    function findProgress(x){if(!x)return null; const alias={'少しずつ':'少し進んだ','バタついてる':'散らかった','進んでない':'詰まった'}; return progresses.find(p=>p.id===x.id||p.label===x.label||p.label===alias[x.label]||p.emoji===x.emoji)||x}
    function normalizeLog(log){
      const emotion=findEmotion(log.emotion); const progress=findProgress(log.progress);
      return {...log, id:log.id||String(Date.now()+Math.random()), createdAt:log.createdAt||new Date().toISOString(), emotion, progress, task:log.task||log.taskName||'', memo:log.memo||'', nextAction:log.nextAction||'', profileName:log.profileName||'', profileEmail:log.profileEmail||'', team:log.team||'', emotionScore:Number.isFinite(log.emotionScore)?log.emotionScore:(emotion?.score??0), progressScore:Number.isFinite(log.progressScore)?log.progressScore:(progress?.score??0)};
    }
    function fmtTime(s){return new Date(s).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}
    function fmtDate(s=new Date()){return new Date(s).toLocaleDateString('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit',weekday:'short'})}
    function startOf(range){const d=new Date(); d.setHours(0,0,0,0); if(range==='week') d.setDate(d.getDate()-6); if(range==='month') d.setDate(d.getDate()-29); return d}
    function rangeLogs(range=state.range){const start=startOf(range); return state.logs.filter(l=>new Date(l.createdAt)>=start)}
    function todayLogs(){return rangeLogs('day')}
    function scoreOf(log){const e=Number.isFinite(log.emotionScore)?log.emotionScore:0; const p=Number.isFinite(log.progressScore)?log.progressScore:0; return Math.max(-2,Math.min(2,(e+p)/2))}
    function avg(arr){return arr.length?arr.reduce((a,b)=>a+b,0)/arr.length:0}
    function topBy(items){const m={}; items.filter(Boolean).forEach(v=>m[v]=(m[v]||0)+1); return Object.entries(m).sort((a,b)=>b[1]-a[1])[0]}
    function weatherFor(score){if(score>=1.4)return'☀️ 晴れ'; if(score>=.4)return'🌤️ 晴れ時々くもり'; if(score>=-.3)return'☁️ くもり'; if(score>=-1.2)return'🌧️ 小雨'; return'⛈️ 荒れ模様'}
    function wordsFrom(logs){
      const stop=['です','ます','した','する','こと','これ','それ','ため','今日','明日','確認','対応','作業','感じ','少し'];
      const text=logs.map(l=>[l.task,l.memo,l.nextAction].join(' ')).join(' ');
      const tokens=(text.match(/[ぁ-んァ-ン一-龠A-Za-z0-9]{2,}/g)||[]).filter(w=>!stop.includes(w));
      const m={}; tokens.forEach(w=>m[w]=(m[w]||0)+1); return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,8);
    }
    function taskStats(logs){
      const map={}; logs.forEach(l=>{const t=l.task||'タスク未設定'; if(!map[t])map[t]=[]; map[t].push(scoreOf(l));});
      return Object.entries(map).map(([task,scores])=>({task,count:scores.length,avg:avg(scores)})).sort((a,b)=>a.avg-b.avg);
    }
    function dailyText(){
      const logs=todayLogs().slice().reverse(); const wLogs=rangeLogs('week'); const score=avg(logs.map(scoreOf)); const weekly=makeWeeklyInsights(wLogs);
      if(!logs.length)return '今日はまだ波の記録がありません。';
      return [`# NamiLog 日報 ${fmtDate()}`,`記録者：${profileLabel()}`,'',`## 今日のこころ天気`,`- ${weatherFor(score)}。平均スコアは ${score.toFixed(1)} です。`,'','## 今日の波の記録',...logs.map(l=>`- ${fmtTime(l.createdAt)} ${l.emotion?.emoji||''} ${l.emotion?.label||''}${l.progress?` / ${l.progress.emoji} ${l.progress.label}`:''}${l.task?`｜${l.task}`:''}${l.memo?`\n  - メモ：${l.memo}`:''}${l.nextAction?`\n  - 次：${l.nextAction}`:''}`),'','## 今日のまとめ','- 気分の波：','- 進んだこと：','- 詰まったこと：','- 明日の一手：','','## 上長面談のたね',...weekly.managerSeeds.map(x=>`- ${x}`)].join('\n')
    }
    function weeklyText(){const logs=rangeLogs('week'); const insights=makeWeeklyInsights(logs); return [`# NamiLog 週報のたね ${fmtDate()}`,`記録者：${profileLabel()}`,'',`## 今週のこころ天気`,`- ${insights.weather}。${insights.summary}`,'','## 目立った波','- 良かった時間・タスク：','- しんどかった時間・タスク：','- 回復につながった要素：','','## よく出た言葉',...(insights.words.length?insights.words.map(([w,c])=>`- ${w}：${c}回`):['- まだ十分なメモがありません']),'','## 上長面談のたね',...insights.managerSeeds.map(x=>`- ${x}`),'','## 来週の一手','- '].join('\n')}
    function makeWeeklyInsights(logs){

      const seeds=[]; if(low&&low.count>=1&&low.avg<0) seeds.push(`「${low.task}」のとき波が下がりやすそうです。詰まり方や支援が必要な点を話す材料になります。`); if(high&&high.count>=1&&high.avg>0) seeds.push(`「${high.task}」のとき比較的よい波が出ています。得意な進め方の再現条件を探せます。`); if(topProgress) seeds.push(`進捗は「${topProgress[0]}」が目立ちました。忙しさより前進感があるかを見るとよさそうです。`); if(!seeds.length) seeds.push('まだ面談材料にするにはログが少なめです。通知から数件ためるところから始めましょう。');
      return {score,weather,topEmotion,topProgress,words,managerSeeds:seeds, summary:`感情は「${topEmotion?topEmotion[0]:'未記録'}」、進捗は「${topProgress?topProgress[0]:'未記録'}」が目立ちます。`};
    }

    function waveSvg(logs){
      const ordered=logs.slice().reverse(); const w=740,h=210,pad=38; const n=Math.max(ordered.length,1); const pts=ordered.length?ordered.map((l,i)=>{const x=pad+(i/(Math.max(n-1,1)))*(w-pad*2); const y=pad+((2-scoreOf(l))/4)*(h-pad*2); return [x,y,l]}):[[pad,h/2,null],[w-pad,h/2,null]];
      const d=pts.map((p,i)=>`${i?'L':'M'}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(' '); const area=`M${pts[0][0]} ${h-pad} `+pts.map(p=>`L${p[0]} ${p[1]}`).join(' ')+` L${pts[pts.length-1][0]} ${h-pad} Z`; const labels=pts.filter((_,i)=>i===0||i===pts.length-1||i%4===0).map(([x,y,l])=>`<text class="axis" x="${x}" y="${h-8}" text-anchor="middle">${l?fmtTime(l.createdAt):''}</text>`).join('');
      return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="モチベーションの波"><defs><linearGradient id="warmLine" x1="0" x2="1"><stop offset="0%" stop-color="#ff7d69"/><stop offset="55%" stop-color="#ed67a8"/><stop offset="100%" stop-color="#9ca4ff"/></linearGradient><linearGradient id="warmArea" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ed67a8" stop-opacity=".20"/><stop offset="100%" stop-color="#9ca4ff" stop-opacity=".03"/></linearGradient></defs><line class="grid" x1="${pad}" y1="${pad}" x2="${w-pad}" y2="${pad}"/><line class="mid" x1="${pad}" y1="${h/2}" x2="${w-pad}" y2="${h/2}"/><line class="grid" x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}"/><text class="axis" x="12" y="${pad+4}">高</text><text class="axis" x="12" y="${h/2+4}">中</text><text class="axis" x="12" y="${h-pad+4}">低</text><path class="area" d="${area}"/><path class="line" d="${d}"/>${pts.map(([x,y])=>`<circle class="dot" cx="${x}" cy="${y}" r="5"/>`).join('')}${labels}</svg>`
    }
    function logList(logs){if(!logs.length)return`<div class="empty"><div><p style="font-size:42px;margin:0">🌤️</p><h3>まだ波の記録がありません</h3><p>「今の波を残す」から、まず1件だけ残してみましょう。</p></div></div>`; return `<div class="logList">${logs.map(l=>`<article class="logCard"><div class="emojiBox"><span>${l.emotion?.emoji||'〜'}</span></div><div><div class="time">${fmtTime(l.createdAt)}</div><h3>${escape(l.emotion?.label||'未選択')}${l.progress?` / ${l.progress.emoji} ${escape(l.progress.label)}`:''}</h3>${l.task?`<p>タスク：${escape(l.task)}</p>`:''}${l.memo?`<p>メモ：${escape(l.memo)}</p>`:''}${l.nextAction?`<p>次：${escape(l.nextAction)}</p>`:''}</div><button class="danger small" data-delete="${l.id}">削除</button></article>`).join('')}</div>`}

    function googleSetupText(){return [`# NamiLog Googleカレンダー連携セットアップ`,'','## Google Cloudで行うこと','1. Google Cloud Consoleでプロジェクトを作る','2. Google Calendar APIを有効化する','3. OAuth同意画面を設定する','4. OAuth Client IDを作る。種類は「ウェブアプリ」','5. 承認済みのJavaScript生成元に https://antisanogile.github.io を追加する','6. 作成された Client ID をNamiLogの「OAuth Client ID」に貼り付ける','','## NamiLog側','- 「Client ID保存」→「Google予定を取得」','- 読み取りスコープは calendar.readonly','- 取得した予定はQuick Checkのタスク候補に入る','','## 本番化メモ','- 全社展開では、各自がGoogleログインして本人の予定だけを取得する。','- DB保存する場合も、予定本文ではなく title/start/end/source 程度に絞る。'].join('\n')}
    function saveGoogleClient(){state.google.clientId=(document.getElementById('googleClientId')?.value||'').trim(); state.google.connected=!!state.google.clientId; state.google.lastError=''; saveGoogleSettings(); toast(state.google.clientId?'Client IDを保存しました':'Client IDを空にしました'); render()}
    function loadGoogleIdentityScript(){return new Promise((resolve,reject)=>{if(window.google?.accounts?.oauth2){resolve();return} const existing=document.querySelector('script[data-google-identity]'); if(existing){existing.addEventListener('load',resolve,{once:true}); existing.addEventListener('error',reject,{once:true}); return} const s=document.createElement('script'); s.src='https://accounts.google.com/gsi/client'; s.async=true; s.defer=true; s.dataset.googleIdentity='1'; s.onload=resolve; s.onerror=reject; document.head.appendChild(s)})}
    async function connectGoogleCalendar(){
      saveGoogleClient();
      if(!state.google.clientId){toast('OAuth Client IDを入れてください');return}
      try{
        await loadGoogleIdentityScript();
        const tokenClient=google.accounts.oauth2.initTokenClient({
          client_id:state.google.clientId,
          scope:'https://www.googleapis.com/auth/calendar.readonly',
          callback:async(resp)=>{
            if(resp.error){state.google.lastError=resp.error; saveGoogleSettings(); toast('Google認証に失敗しました'); render(); return}
            await fetchGoogleTodayEvents(resp.access_token)
          }
        });
        tokenClient.requestAccessToken({prompt:'consent'});
      }catch(e){state.google.lastError='Google Identity Servicesを読み込めませんでした'; saveGoogleSettings(); toast('Google連携の準備に失敗しました'); render()}
    }
    async function fetchGoogleTodayEvents(accessToken){
      try{
        const start=new Date(); start.setHours(0,0,0,0); const end=new Date(start); end.setDate(end.getDate()+1);
        const params=new URLSearchParams({timeMin:start.toISOString(),timeMax:end.toISOString(),singleEvents:'true',orderBy:'startTime',maxResults:'20'});
        const res=await fetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events?${params.toString()}`,{headers:{Authorization:`Bearer ${accessToken}`}});
        if(!res.ok){throw new Error(`Calendar API ${res.status}`)}
        const data=await res.json();
        const items=(data.items||[]).filter(e=>e.status!=='cancelled').map((e,i)=>{
          const st=e.start?.dateTime||e.start?.date||''; const en=e.end?.dateTime||e.end?.date||''; const sd=st?new Date(st):null; const ed=en?new Date(en):null;
          return {id:`google-${e.id||Date.now()+'-'+i}`,time:sd&&!isNaN(sd)?sd.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'}):'',end:ed&&!isNaN(ed)?ed.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'}):'',title:e.summary||'予定名なし',source:'google'}
        });
        state.calendarItems=items; state.google.connected=true; state.google.lastSyncAt=new Date().toISOString(); state.google.lastError=''; saveCalendarItems(); saveGoogleSettings(); toast(`${items.length}件の予定を取得しました`); render();
      }catch(e){state.google.lastError=e.message||'Calendar APIの取得に失敗しました'; saveGoogleSettings(); toast('予定取得に失敗しました'); render()}
    }

    function aiPromptText(type='weekly'){
      const logs=type==='daily'?todayLogs():rangeLogs('week'); const insights=makeWeeklyInsights(logs); const taskLine=taskStats(logs).slice(0,5).map(t=>`${t.task}: 平均${t.avg.toFixed(1)} / ${t.count}件`).join('、')||'まだ不足'; const wordLine=wordsFrom(logs).map(([w,c])=>`${w}(${c})`).join('、')||'まだ不足';
      const header=type==='oneonone'?'上長との1on1に向けた分析':type==='daily'?'今日の日報深掘り':'週次ふりかえり分析';
      return [`# NamiLog ${header}プロンプト`,``,`あなたは業務ジャーナリング分析の伴走者です。以下のNamiLogデータから、本人が日報・週報・上長面談を書きやすくなるように、やさしく具体的に分析してください。断定しすぎず、「仮説」と「次に観察するとよいこと」を分けてください。`,``,`## 目的`,`- 感情/進捗/タスクのつながりを見つける`,`- 日報・週報・1on1で話す材料を作る`,`- 本人を責めず、再現条件と支援ポイントを探す`,``,`## 出力形式`,`1. 今回のこころ天気`,`2. 感情の波の特徴`,`3. 進捗が上がった/下がったタスクの仮説`,`4. よく出た言葉から見える関心事`,`5. 日報または週報にそのまま使える文章`,`6. 上長に相談するとよさそうなこと`,`7. 来週/明日の一手`,``,`## 既存サマリ`,`- こころ天気: ${insights.weather}` ,`- 平均スコア: ${insights.score.toFixed(1)}`,`- 多い感情: ${insights.topEmotion?insights.topEmotion[0]:'未記録'}`,`- 多い進捗: ${insights.topProgress?insights.topProgress[0]:'未記録'}`,`- タスク別傾向: ${taskLine}`,`- よく出た言葉: ${wordLine}`,``,`## ログデータ`,compactLogsForAi(logs)].join('\n')
    }
    function aiSummaryText(){const logs=rangeLogs('week'); const insights=makeWeeklyInsights(logs); return [`# NamiLog 分析サマリ`,`記録者：${profileLabel()}`,`対象：直近7日 / ${logs.length}件`,`こころ天気：${insights.weather}`,`平均スコア：${insights.score.toFixed(1)}`,`多い感情：${insights.topEmotion?insights.topEmotion[0]:'未記録'}`,`多い進捗：${insights.topProgress?insights.topProgress[0]:'未記録'}`,`よく出た言葉：${wordsFrom(logs).map(([w,c])=>`${w}(${c})`).join('、')||'まだ不足'}`,`上長面談のたね：`,...insights.managerSeeds.map(x=>`- ${x}`)].join('\n')}

    function settingsHtml(){const label=state.permission==='granted'?'許可済み':state.permission==='denied'?'ブロック中':state.permission==='unsupported'?'非対応':'未許可'; return `<div class="settingsBox"><div class="sectionHead" style="margin-bottom:8px"><div><h3>リマインド通知</h3><p class="hint">他の作業中でも、Windows右下からNamiLogがそっと声をかけます。</p></div><span class="statusPill ${state.permission}">${label}</span></div><div class="sideActions"><button class="primary small" data-action="requestNotify">通知オン</button><button class="ghost small" data-action="testNotify">テスト通知</button></div><label class="settingRow"><span>定期的に声をかけてもらう</span><input type="checkbox" data-action="toggleNotify" ${state.settings.browserNotification?'checked':''}></label><label class="settingRow"><span>間隔</span><select data-action="interval"><option value="30" ${state.settings.intervalMinutes==30?'selected':''}>30分</option><option value="60" ${state.settings.intervalMinutes==60?'selected':''}>1時間</option><option value="120" ${state.settings.intervalMinutes==120?'selected':''}>2時間</option><option value="180" ${state.settings.intervalMinutes==180?'selected':''}>3時間</option></select></label><p class="hint">通知クリックでQuick Checkが開きます。定期通知はNamiLogを開いている間に動きます。</p></div>`}
    function quickModal(){const d=state.draft; return `<div class="modalBackdrop"><div class="quick"><button class="close" data-action="closeQuick">×</button><p class="eyebrow">QUICK CHECK</p><h2>今の波を残そう</h2><p class="quickLead">感情と進み具合を選ぶだけで、日報と週報のたねになります。</p><div class="choiceTitle"><h3>感情</h3><span>1つ選択</span></div><div class="choiceGrid">${emotions.map(e=>`<button class="choice ${d.emotion?.id===e.id?'selected':''}" data-emotion="${e.id}"><span>${e.emoji}</span><strong>${e.label}</strong></button>`).join('')}</div><div class="choiceTitle"><h3>仕事の進み具合</h3><span>任意</span></div><div class="choiceGrid">${progresses.map(p=>`<button class="choice ${d.progress?.id===p.id?'selected':''}" data-progress="${p.id}"><span>${p.emoji}</span><strong>${p.label}</strong></button>`).join('')}</div><div class="quickFields"><label><span>今のタスク</span><select id="draftTask"><option value="">選択なし</option>${allTaskOptions().map(t=>`<option value="${escape(t)}" ${d.task===t?'selected':''}>${escape(t)}</option>`).join('')}</select></label><label><span>30秒メモ</span><input id="draftMemo" placeholder="例：少し詰まったが前進あり" value="${escape(d.memo)}"></label><label class="wide"><span>次にやること</span><input id="draftNext" placeholder="例：上長に相談する/明日確認する" value="${escape(d.nextAction)}"></label></div><div class="modalActions"><button class="primary" data-action="saveQuick">この波を残す</button><button class="ghost" data-action="saveEmotionOnly">感情だけで残す</button><button class="textBtn" data-action="closeQuick">閉じる</button></div></div></div>`}
    function bindEvents(){
      document.querySelectorAll('[data-action="openQuick"]').forEach(b=>b.onclick=()=>{state.draft=draftWithSuggestedTask();state.quickOpen=true;render()});
      document.querySelectorAll('[data-action="closeQuick"]').forEach(b=>b.onclick=()=>{state.quickOpen=false;render()});
      document.querySelectorAll('[data-action="copyDaily"]').forEach(b=>b.onclick=()=>copyText(dailyText(),'日報のたねをコピーしました'));
      document.querySelectorAll('[data-action="copyWeekly"]').forEach(b=>b.onclick=()=>copyText(weeklyText(),'週報のたねをコピーしました'));
      const exp=document.querySelector('[data-action="exportJson"]'); if(exp)exp.onclick=exportJson;
      const clr=document.querySelector('[data-action="clearAll"]'); if(clr)clr.onclick=()=>{if(confirm('すべてのログを削除しますか？')){state.logs=[];saveLogs();toast('すべて削除しました')}};
      document.querySelectorAll('[data-range]').forEach(b=>b.onclick=()=>{state.range=b.dataset.range;render()});
      document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{state.logs=state.logs.filter(l=>l.id!==b.dataset.delete);saveLogs();toast('削除しました')});
      document.querySelectorAll('[data-emotion]').forEach(b=>b.onclick=()=>{state.draft.emotion=emotions.find(e=>e.id===b.dataset.emotion);render()});
      document.querySelectorAll('[data-progress]').forEach(b=>b.onclick=()=>{state.draft.progress=progresses.find(p=>p.id===b.dataset.progress);render()});
      const save=document.querySelector('[data-action="saveQuick"]'); if(save)save.onclick=saveQuick;
      const saveE=document.querySelector('[data-action="saveEmotionOnly"]'); if(saveE)saveE.onclick=()=>{state.draft.progress=null;saveQuick()};
      const req=document.querySelector('[data-action="requestNotify"]'); if(req)req.onclick=requestNotify;
      const test=document.querySelector('[data-action="testNotify"]'); if(test)test.onclick=()=>showBrowserNotification('manual');
      const toggle=document.querySelector('[data-action="toggleNotify"]'); if(toggle)toggle.onchange=e=>{if(e.target.checked&&Notification.permission!=='granted'){requestNotify();return} state.settings.browserNotification=e.target.checked;saveSettings();render()};
      const interval=document.querySelector('[data-action="interval"]'); if(interval)interval.onchange=e=>{state.settings.intervalMinutes=Number(e.target.value);saveSettings();setupInterval();toast('通知間隔を更新しました')};
      const cal=document.getElementById('calendarText'); if(cal)cal.oninput=e=>state.calendarText=e.target.value;
      const importCal=document.querySelector('[data-action="importCalendar"]'); if(importCal)importCal.onclick=()=>{const items=parseCalendarText(document.getElementById('calendarText')?.value||''); if(!items.length){toast('予定を1行以上入れてね');return} state.calendarItems=items; saveCalendarItems(); toast('予定候補を取り込みました'); render()};
      const sampleCal=document.querySelector('[data-action="sampleCalendar"]'); if(sampleCal)sampleCal.onclick=()=>{state.calendarText='09:30 朝会\n10:00-11:00 顧客MTG\n13:00 企画整理\n15:00 1on1\n17:30 日報'; render()};
      const clearCal=document.querySelector('[data-action="clearCalendar"]'); if(clearCal)clearCal.onclick=()=>{state.calendarItems=[]; state.calendarText=''; saveCalendarItems(); toast('予定候補をクリアしました'); render()};
      document.querySelectorAll('[data-calendar-task]').forEach(b=>b.onclick=()=>{state.draft=draftWithSuggestedTask();state.draft.task=b.dataset.calendarTask;state.quickOpen=true;render()});
      const saveProf=document.querySelector('[data-action="saveProfile"]'); if(saveProf)saveProf.onclick=()=>{state.profile.name=(document.getElementById('profileName')?.value||'').trim(); state.profile.email=(document.getElementById('profileEmail')?.value||'').trim(); state.profile.team=(document.getElementById('profileTeam')?.value||'').trim(); saveProfile(); toast('マイログ設定を保存しました')};
      const copyPlan=document.querySelector('[data-action="copyAccountPlan"]'); if(copyPlan)copyPlan.onclick=()=>copyText(accountPlanText(),'アカウント設計メモをコピーしました');
      const aiWeekly=document.querySelector('[data-action="copyAiWeekly"]'); if(aiWeekly)aiWeekly.onclick=()=>copyText(aiPromptText('weekly'),'AI週次分析プロンプトをコピーしました');
      const aiOne=document.querySelector('[data-action="copyAiOneOnOne"]'); if(aiOne)aiOne.onclick=()=>copyText(aiPromptText('oneonone'),'1on1分析プロンプトをコピーしました');
      const aiDaily=document.querySelector('[data-action="copyAiDaily"]'); if(aiDaily)aiDaily.onclick=()=>copyText(aiPromptText('daily'),'日報深掘りプロンプトをコピーしました');
      const aiSummary=document.querySelector('[data-action="copyAiSummary"]'); if(aiSummary)aiSummary.onclick=()=>copyText(aiSummaryText(),'分析サマリをコピーしました');
      const saveG=document.querySelector('[data-action="saveGoogleClient"]'); if(saveG)saveG.onclick=saveGoogleClient;
      const connectG=document.querySelector('[data-action="connectGoogleCalendar"]'); if(connectG)connectG.onclick=connectGoogleCalendar;
      const copyG=document.querySelector('[data-action="copyGoogleSetup"]'); if(copyG)copyG.onclick=()=>copyText(googleSetupText(),'Googleカレンダー設定手順をコピーしました');
      const copySchema=document.querySelector('[data-action="copySchema"]'); if(copySchema)copySchema.onclick=()=>copyText(supabaseSchemaText(),'DBスキーマをコピーしました');
      const copyRls=document.querySelector('[data-action="copyRls"]'); if(copyRls)copyRls.onclick=()=>copyText(rlsPolicyText(),'RLS設計をコピーしました');
      const importJsonBtn=document.querySelector('[data-action="importJson"]'); const importFile=document.getElementById('jsonImportFile'); if(importJsonBtn&&importFile)importJsonBtn.onclick=()=>importFile.click(); if(importFile)importFile.onchange=importJsonFromFile;
      const add=document.querySelector('[data-action="addTask"]'); const input=document.getElementById('newTask'); if(input)input.oninput=e=>state.newTask=e.target.value; if(add)add.onclick=()=>{const v=(document.getElementById('newTask')?.value||'').trim(); if(v&&!state.tasks.includes(v)){state.tasks.push(v);state.newTask='';saveTasks();toast('タスク候補を追加しました')}render()};
      document.querySelectorAll('[data-task]').forEach(b=>b.onclick=()=>{state.draft=draftWithSuggestedTask();state.draft.task=b.dataset.task;state.quickOpen=true;render()});
    }
    function schemaPreviewText(){return 'users / logs / calendar_events の3テーブル + user_idで本人だけ参照。詳しくは「DBスキーマをコピー」。'}
    function supabaseSchemaText(){return [`-- NamiLog Supabase schema draft`,`create table public.profiles (`,`  id uuid primary key references auth.users(id) on delete cascade,`,`  name text,`,`  email text,`,`  team text,`,`  created_at timestamptz default now()` ,`);`,``, `create table public.logs (`,`  id uuid primary key default gen_random_uuid(),`,`  user_id uuid not null references auth.users(id) on delete cascade,`,`  created_at timestamptz not null default now(),`,`  emotion_id text,`,`  emotion_label text,`,`  emotion_score numeric,`,`  progress_id text,`,`  progress_label text,`,`  progress_score numeric,`,`  task text,`,`  memo text,`,`  next_action text,`,`  source text default 'quick_check'`,`);`,``, `create table public.calendar_events (`,`  id uuid primary key default gen_random_uuid(),`,`  user_id uuid not null references auth.users(id) on delete cascade,`,`  start_at timestamptz,`,`  end_at timestamptz,`,`  title text,`,`  source text default 'google_calendar',`,`  created_at timestamptz default now()`,`);`].join('\n')}
    function rlsPolicyText(){return [`-- NamiLog RLS policy draft`,`alter table public.profiles enable row level security;`,`alter table public.logs enable row level security;`,`alter table public.calendar_events enable row level security;`,``, `create policy "profiles are own data" on public.profiles`,`for all using (auth.uid() = id) with check (auth.uid() = id);`,``, `create policy "logs are own data" on public.logs`,`for all using (auth.uid() = user_id) with check (auth.uid() = user_id);`,``, `create policy "calendar events are own data" on public.calendar_events`,`for all using (auth.uid() = user_id) with check (auth.uid() = user_id);`].join('\n')}
    function accountPlanText(){return [`# NamiLog 個別アカウント設計メモ`,'',`## 目的`,'- 全社利用時も、各社員が自分だけの感情・進捗・タスクログを作り、本人だけが参照できる状態にする。','- 上長共有は自動ではなく、本人が日報/週報/面談のたねとして任意にコピーして使う。','',`## 最小データ`,'- user: id, name, email, team','- log: user_id, created_at, emotion, emotion_score, progress, progress_score, task, memo, next_action','- calendar_event: user_id, start_at, end_at, title, source','',`## 次の実装候補`,'1. Googleログイン','2. Supabase等のDBにユーザー別保存','3. Row Level Securityで本人のログだけ読めるようにする','4. Googleカレンダー同期をユーザー単位で許可制にする'].join('\n')}
    function saveQuick(){
      const task=document.getElementById('draftTask')?.value||state.draft.task||''; const memo=document.getElementById('draftMemo')?.value||''; const next=document.getElementById('draftNext')?.value||'';
      if(!state.draft.emotion&&!state.draft.progress){toast('感情か進み具合をひとつ選んでね');return}
      const emotion=state.draft.emotion||{id:'unknown',emoji:'〜',label:'未選択',score:0}; const progress=state.draft.progress;
      const log=normalizeLog({id:`${Date.now()}-${Math.random().toString(36).slice(2)}`,createdAt:new Date().toISOString(),emotion,progress,task,memo,nextAction:next,profileName:state.profile.name,profileEmail:state.profile.email,team:state.profile.team,emotionScore:emotion.score??0,progressScore:progress?.score??0});
      if(task&&!state.tasks.includes(task)){state.tasks.push(task);saveTasks()}
      state.logs=[log,...state.logs]; state.quickOpen=false; state.draft=blankDraft(); saveLogs(); toast('今の波を記録しました');
    }
    async function copyText(text,msg){try{await navigator.clipboard.writeText(text); toast(msg)}catch{toast('コピーに失敗しました')}}
    function exportJson(){const blob=new Blob([JSON.stringify({profile:state.profile,logs:state.logs},null,2)],{type:'application/json'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=`namilog-${new Date().toISOString().slice(0,10)}.json`; a.click(); URL.revokeObjectURL(url)}
    function importJsonFromFile(event){const file=event.target.files?.[0]; if(!file)return; const reader=new FileReader(); reader.onload=()=>{try{const data=JSON.parse(reader.result); const incoming=Array.isArray(data)?data:(data.logs||[]); if(!Array.isArray(incoming)){toast('logs配列が見つかりません');return} const normalized=incoming.map(normalizeLog); const merged=[...normalized,...state.logs]; const byId=new Map(); merged.forEach(l=>byId.set(l.id,l)); state.logs=Array.from(byId.values()).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)); if(data.profile){state.profile={...state.profile,...data.profile}; saveProfile()} saveLogs(); toast(`${normalized.length}件のログを取り込みました`); render()}catch(e){toast('JSON取り込みに失敗しました')}}; reader.readAsText(file); event.target.value=''}
    function toast(msg){state.toast=msg;render();setTimeout(()=>{state.toast='';render()},2200)}
    async function registerSW(){if(!('serviceWorker'in navigator))return null; try{const reg=await navigator.serviceWorker.register(`${BASE_PATH}namilog-sw.js?v=12`,{scope:BASE_PATH}); await reg.update(); state.registration=reg; return reg}catch(e){console.warn(e);return null}}
    async function requestNotify(){if(!('Notification'in window)){state.permission='unsupported';toast('このブラウザは通知に対応していません');return} const p=await Notification.requestPermission(); state.permission=p; if(p==='granted'){state.settings.browserNotification=true;saveSettings();await showBrowserNotification('manual')} else toast('通知はまだ許可されていません'); render()}
    async function showBrowserNotification(reason='manual'){if(!('Notification'in window)){toast('通知に対応していません');return} if(Notification.permission!=='granted'){toast('先に通知オンを押してください');return} const reg=state.registration||await registerSW(); const url=new URL(`${BASE_PATH}?quickCheck=1`,location.origin).href; const opts={body:reason==='scheduled'?'そろそろ今の気分と進み具合を残しておこう。':'クリックすると、今の波を残せます。',tag:'namilog-wave-v12',renotify:true,data:{url},actions:[{action:'open',title:'今の波を残す'},{action:'later',title:'あとで'}]}; try{if(reg&&reg.showNotification) await reg.showNotification('NamiLog そっと声かけ',opts); else new Notification('NamiLog そっと声かけ',opts); if(reason==='manual')toast('テスト通知を出しました')}catch(e){try{new Notification('NamiLog そっと声かけ',opts);toast('テスト通知を出しました')}catch{toast('通知を出せませんでした')}}}
    let intervalId=null; function setupInterval(){if(intervalId)clearInterval(intervalId); if(state.settings.browserNotification&&state.permission==='granted'){intervalId=setInterval(()=>showBrowserNotification('scheduled'),state.settings.intervalMinutes*60*1000)}}
    if('serviceWorker'in navigator){navigator.serviceWorker.addEventListener('message',e=>{if(e.data?.type==='OPEN_QUICK_CHECK'){state.draft=draftWithSuggestedTask();state.quickOpen=true;render()}})}
    const params=new URLSearchParams(location.search); if(params.get('quickCheck')==='1'){state.draft=draftWithSuggestedTask();state.quickOpen=true; history.replaceState({},'',location.pathname)}
    registerSW().then(()=>setupInterval()); render();
  </script>
